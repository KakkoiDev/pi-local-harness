[project]
name = "app"
version = "0.1.0"
description = "A Pi Workbench project (the stack: FastAPI, Jinja, htmx 4, Basecoat, SQLite)."
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "jinja2", "python-multipart"]

[dependency-groups]
dev = ["pytest", "httpx2", "pyright[nodejs]", "pytailwindcss", "playwright==1.56.0", "pytest-playwright==0.9.0"]

[tool.pyright]
typeCheckingMode = "strict"
extraPaths = ["test-core"]
include = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "test-core"]  # test-core's functional library and test blocks (task 332)
