<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="js/components.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Bebas Neue', sans-serif; }
    </style>
</head>
<body class="bg-white text-black">
    <portfolio-header></portfolio-header>

    <main id="main-content">
        <section id="hero" class="mx-auto max-w-3xl px-4 py-32 flex flex-col items-center justify-center text-center">
            <h1 class="font-display text-7xl md:text-9xl leading-none tracking-tighter mb-4">
                CREATIVE <span class="text-gray-400">DEV</span>
            </h1>
            <p class="text-lg md:text-xl font-light tracking-widest uppercase text-gray-600">
                Building digital experiences with precision.
            </p>
        </section>

        <section id="about" class="mx-auto max-w-3xl px-4 py-16 border-t border-black">
            <h2 class="font-display text-3xl mb-6 tracking-tight">What I do</h2>
            <ul class="space-y-4">
                <li class="text-xl md:text-2xl font-semibold leading-tight">I solve complex problems.</li>
                <li class="text-xl md:text-2xl font-semibold leading-tight">I build robust, scalable systems.</li>
                <li class="text-xl md:text-2xl font-semibold leading-tight">I help teams grow through technical leadership.</li>
            </ul>
        </section>

        <section id="projects" class="mx-auto max-w-3xl px-4 py-16 border-t border-black">
            <h2 class="font-display text-3xl mb-8 tracking-tight">Projects</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <project-card 
                    title="AI Agent Framework" 
                    description="A toolkit for building production-ready AI agents with minimal boilerplate." 
                    link="project-ai.html" 
                    tags="Python · LLMs">
                </project-card>
                <project-card 
                    title="Distributed Database" 
                    description="An experimental distributed key-value store built for high availability." 
                    link="project-db.html" 
                    tags="Go · Raft">
                </project-card>
            </div>
        </section>

        <section id="contact" class="mx-auto max-w-3xl px-4 py-16 border-t border-black">
            <h2 class="font-display text-3xl mb-6 tracking-tight">Contact</h2>
            <div class="flex flex-wrap gap-x-8 gap-y-4 text-lg">
                <a href="mailto:hello@example.com" class="underline hover:text-gray-500 transition-colors">hello@example.com</a>
                <a href="#" class="underline hover:text-gray-500 transition-colors">GitHub</a>
                <a href="#" class="underline hover:text-gray-500 transition-colors">LinkedIn</a>
            </div>
        </section>
    </main>

    <portfolio-footer></portfolio-footer>
    <agent-chat></agent-chat>
</body>
</html>
