    { url = "https://example.invalid/native-2.0-cp314-cp314-manylinux_2_17_x86_64.manylinux2014_x86_64.whl", hash = "sha256:0", size = 3000 },
    { url = "https://example.invalid/native-2.0-cp314-cp314-win_amd64.whl", hash = "sha256:0", size = 4000 },
]

