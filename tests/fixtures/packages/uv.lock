version = 1
revision = 5
requires-python = ">=3.12"

[[package]]
name = "app"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "plain" },
    { name = "native" },
    { name = "windows-only", marker = "sys_platform == 'win32'" },
    { name = "old-python", marker = "python_full_version < '3.13'" },
]

[package.dev-dependencies]
dev = [
    { name = "tool", extra = ["fast"] },
]

[[package]]
name = "plain"
version = "1.0"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://example.invalid/plain-1.0.tar.gz", hash = "sha256:0", size = 9000 }
wheels = [
    { url = "https://example.invalid/plain-1.0-py3-none-any.whl", hash = "sha256:0", size = 1000 },
]

[[package]]
name = "native"
version = "2.0"
