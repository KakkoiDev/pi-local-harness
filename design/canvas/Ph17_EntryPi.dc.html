<style>body{margin:0}
/* ---- 2026-10-15 · Round 7: the app, running beside the chat (plan 198) ---- */

/* PreviewWindow: the project's own app, live, in a window beside the chat (a view when the chat would drop under 480px). */
.pw-preview{display:flex;flex-direction:column;min-width:0}
.pw-address{flex:1 1 160px;min-width:0;display:flex;align-items:center;gap:6px;height:30px;border:1px solid var(--ink);box-shadow:var(--shadow-field);background:var(--paper);padding:0 8px;font-family:var(--font-mono);font-size:13px}
.pw-address__host{flex:none;color:var(--ink-disabled);font-family:var(--font-chrome)}
.pw-address input{flex:1;min-width:0;border:0;padding:0;background:none;font:inherit;color:var(--ink);outline:none}
.pw-preview__note{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:4px 12px;border-bottom:1px solid var(--ink);font-family:var(--font-chrome);font-size:13px;line-height:18px}
.pw-preview__note time{margin-left:auto}
.pw-preview__stage{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px}
.pw-preview__frame{flex:none;position:relative;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--ink);overflow:hidden}
.pw-preview__frame>iframe{display:block;border:0;width:100%;height:100%}
.pw-preview__frame[data-scaled]>*{transform-origin:0 0}
.pw-preview__caption{flex:none;font-family:var(--font-chrome);font-size:12px;line-height:16px;background:var(--paper);padding:0 6px}
.pw-preview__empty{margin:auto;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--paper);border:1px solid var(--ink);padding:20px 22px;font-family:var(--font-chrome);font-size:15px;line-height:21px}
.pw-preview__empty p{margin:0}
.pw-preview__error{align-self:stretch;margin:0;border:1px solid var(--ink);background:var(--paper);padding:8px 10px;font-family:var(--font-mono);font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.pw-preview--dim .pw-preview__stage,.pw-preview--dim .pw-toolbar,.pw-preview--dim .pw-statusbar{color:var(--ink-disabled)}
.pw-preview__foot{flex:none;border-top:1px solid var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 12px;font-family:var(--font-chrome);font-size:13px}
.pw-preview__foot .pw-btn{min-height:26px;font-size:14px;padding:0 10px}

/* DoneRow: under each finished answer, what was done in plain words; the request is one commit. */
.pw-done{align-self:stretch;max-width:760px;margin:-12px 0 0;border-top:1px solid var(--ink);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.pw-done__head{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-family:var(--font-chrome);font-size:13px;line-height:18px}
.pw-done__head time{color:inherit}
.pw-done__text{margin:0;font-family:var(--font-text);font-size:16px;line-height:1.45;text-wrap:pretty}
.pw-done__actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.pw-done__actions .pw-btn{min-height:26px;font-size:14px;padding:0 10px}

/* LessonLine: at most one per answer, when the person meets an idea for the first time. */
.pw-lesson{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;border-top:1px dotted var(--ink);padding-top:6px;font-family:var(--font-chrome);font-size:13px;line-height:18px}
.pw-lesson__hide{margin-left:auto;font:inherit;color:inherit;background:none;border:0;padding:0 2px;text-decoration:underline;text-underline-offset:2px;cursor:default}

@media (max-width:760px){
  .pw-address{height:44px;font-size:15px}
  .pw-done__actions .pw-btn,.pw-preview__foot .pw-btn{min-height:var(--size-touch);font-size:16px}
  .pw-lesson__hide{min-height:44px}
  .pw-preview__stage{padding:0}
  .pw-preview__frame{border:0;box-shadow:none}
}
.pw-seg>[disabled]{color:var(--ink-disabled)}
/* Radio: a 14px circle, an 8px dot when chosen. Used by New Project's kind. */
.pw-radio{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1px solid var(--ink);border-radius:50%;background:var(--paper);margin:3px 0 0;display:inline-grid;place-content:center;flex:none}
.pw-radio:checked::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.pw-choice{display:grid;grid-template-columns:14px 1fr;gap:2px 10px;align-items:start;padding:6px 0;font-family:var(--font-chrome);font-size:15px;line-height:20px}
.pw-choice small{grid-column:2;display:block;font-size:13px;line-height:18px}
.pw-lines{margin:6px 0 0;padding:0;list-style:none;font-family:var(--font-mono);font-size:12px;line-height:1.6}
.pw-lines li{display:flex;gap:12px}.pw-lines li span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
/* ---- 2026-10-16 · Rounds 9–10: updates, plan mode (plan 236) ---- */

/* Card: a framed card inside Pi's message (ChoiceCard, PlanCard, CheckInCard, AwayCard). Same frame as WorkerCard. */
.pw-card{align-self:stretch;max-width:640px;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;flex-direction:column;font-family:var(--font-chrome);font-size:15px;line-height:20px}
.pw-card__head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:8px 12px;border-bottom:1px solid var(--ink);font-size:13px;line-height:18px}
.pw-card__title{margin:0;font-size:15px;line-height:20px;font-weight:600;flex:1 1 200px}
.pw-card__body{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pw-card__body>p{margin:0}
.pw-card__foot{padding:8px 12px;border-top:1px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pw-card__foot .pw-btn{min-height:26px;font-size:14px;padding:0 10px}
.pw-card__links{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.pw-card--settled{box-shadow:none}
.pw-card--auto{border-style:dotted;box-shadow:none}
.pw-card--old{box-shadow:none;color:var(--ink-disabled);border-color:var(--ink-disabled)}
/* One answered line: a settled card collapses to it */
.pw-card__line{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:6px 10px;font-size:14px}
.pw-card__line b{font-weight:600}
.pw-card__line .pw-link{margin-left:auto;font-size:13px}

/* Tag: a small framed word (Recommended, chosen, given, auto) */
.pw-tag{display:inline-flex;align-items:center;font-family:var(--font-chrome);font-size:11px;line-height:16px;border:1px solid var(--ink);padding:0 4px;white-space:nowrap}
.pw-tag--dotted{border-style:dotted}

/* Option rows (ChoiceCard): radio, label, tag, one-line detail */
.pw-option{display:grid;grid-template-columns:14px 1fr;gap:2px 10px;align-items:start;padding:7px 2px;border-top:1px dotted var(--ink);cursor:default}
.pw-option:first-child{border-top:0}
.pw-option__label{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.pw-option small{grid-column:2;font-size:13px;line-height:18px}
.pw-option .pw-field{grid-column:2;font-size:15px;min-height:30px;padding:4px 8px}

/* PlanCard */
.pw-plan__goal{margin:0;font-family:var(--font-text);font-size:16px;line-height:1.45}
.pw-plan__h{margin:4px 0 0;font-size:13px;font-weight:600;text-transform:none}
.pw-plan__tasks{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.pw-plan__tasks small{display:block;font-size:13px;line-height:18px}
.pw-plan__decisions{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:14px}
.pw-plan__decisions li{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.pw-facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.pw-facts dt{font-weight:600}.pw-facts dd{margin:0}

/* AutoToggle: next to Send */
.pw-auto{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-chrome);font-size:14px;cursor:default;white-space:nowrap}

@media (max-width:760px){
  .pw-card{max-width:none}
  .pw-option{min-height:44px;grid-template-columns:22px 1fr;align-items:center}
  .pw-option .pw-radio{width:22px;height:22px;margin:0}
  .pw-option .pw-radio:checked::before{width:12px;height:12px}
  .pw-card__foot .pw-btn{min-height:var(--size-touch);font-size:16px;flex:1 1 auto}
  .pw-card__links a{min-height:44px;display:inline-flex;align-items:center}
  .pw-auto{min-height:44px;font-size:15px}
  .pw-auto .pw-check{width:22px;height:22px}
}
/* ---- 2026-10-17 · Round 11: three phases for every request (task 247), context reasons (task 234) ---- */

/* PhaseControl: a popup button in the composer row; the project's phase, set only by the person. */
.pw-phase{position:relative;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 26px 0 10px;font-family:var(--font-chrome);font-size:14px;line-height:18px;color:var(--ink);background:var(--paper);border:1px solid var(--ink);border-radius:0;box-shadow:var(--shadow-popup);white-space:nowrap;cursor:default}
.pw-phase::after{content:"";position:absolute;right:9px;top:50%;margin-top:-2px;border:4px solid transparent;border-top:5px solid currentColor;border-bottom:0}
.pw-phase:hover{background:var(--wash)}
.pw-phase[aria-expanded="true"]{background:var(--selection-bg);color:var(--selection-fg)}
.pw-phase:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pw-phase[aria-busy="true"]{border-style:dotted;box-shadow:none}
.pw-phase__label{font-weight:600}
.pw-phase .pw-tag{margin-left:2px}
.pw-phase-menu{min-width:340px}
.pw-phase-menu .pw-menu__item{height:auto;min-height:44px;padding-top:6px;padding-bottom:6px;align-items:flex-start;flex-direction:column;gap:1px;white-space:normal}
.pw-phase-menu .pw-menu__item>span:first-child{display:flex;width:100%;justify-content:space-between;gap:16px;font-weight:600}
.pw-phase-menu small{font-size:13px;line-height:17px;font-weight:400}
.pw-phase-menu .pw-menu__note{white-space:normal}

/* PhaseLine: a quiet line in the chat each time the phase changes */
.pw-phase-line{align-self:center;display:flex;align-items:center;gap:8px;margin:0;font-family:var(--font-chrome);font-size:13px;line-height:18px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:3px 12px}

/* WaitingStrip: in Discussion, planned tasks that wait to be built */
.pw-waiting{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:8px 16px;border-top:1px solid var(--ink);font-family:var(--font-chrome);font-size:14px;line-height:18px}
.pw-waiting__tasks{flex:1 1 200px;min-width:0}

/* Phase refusal inside a tool row: same layout as Gate's block, named by the phase */
.pw-tool__reason{margin:0;padding:6px 12px;border-bottom:1px solid var(--ink);font-family:var(--font-chrome);font-size:13px;line-height:18px}
.pw-why{font-family:var(--font-chrome);font-size:13px}
.pw-why>summary{cursor:default;text-decoration:underline;text-underline-offset:2px}
.pw-why ul{margin:4px 0 0;padding-left:18px}

/* ContextLine reasons: a Why? button opens the list with the full path and the reason for each file */
.pw-context__why{flex:none;font:inherit;color:inherit;background:none;border:0;padding:0 2px;margin-left:6px;text-decoration:underline;text-underline-offset:2px;cursor:default}
.pw-context__why[aria-expanded="true"]{background:var(--selection-bg);color:var(--selection-fg);text-decoration:none}
.pw-reasons{background:var(--paper);border:1px solid var(--ink);box-shadow:var(--shadow-popup);padding:8px 0;font-family:var(--font-chrome);font-size:14px;line-height:18px;width:440px}
.pw-reasons h3{margin:0 12px 6px;font-size:13px;font-weight:600}
.pw-reasons ol{margin:0;padding:0;list-style:none}
.pw-reasons li{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding:5px 12px;border-top:1px dotted var(--ink)}
.pw-reasons li:first-child{border-top:0}
.pw-reasons .pw-reasons__path{grid-column:1/-1;font-family:var(--font-mono);font-size:12px;color:var(--ink-disabled);overflow-wrap:anywhere}
.pw-reasons .pw-reasons__why{grid-column:1/-1;font-size:13px}
.pw-reasons p{margin:6px 12px 0;font-size:12px}

@media (max-width:760px){
  .pw-phase{height:44px;font-size:16px;padding-right:30px}
  .pw-phase-menu .pw-menu__item{min-height:64px}
  .pw-reasons{width:auto;border:0;box-shadow:none;padding:0}
  .pw-reasons li{padding:8px 0;min-height:44px}
  .pw-context__why{min-height:44px}
}
/* ---- 2026-10-18 · Round 12: Project Start (plan 253) and the review's screens (tasks 260–263, 290, 291, plan 267) ---- */

/* HarnessNotice: an inline note from the harness under an answer (not Pi's words) */
.pw-notice{align-self:stretch;max-width:760px;margin:-12px 0 0;display:flex;align-items:flex-start;flex-wrap:wrap;gap:4px 10px;border:1px dotted var(--ink);padding:6px 10px;font-family:var(--font-chrome);font-size:13px;line-height:18px}
.pw-notice__who{font-weight:600}
.pw-notice__text{flex:1 1 240px;min-width:0}

/* CutLine: under an answer that was stopped or failed before Pi finished */
.pw-cut{align-self:stretch;max-width:760px;margin:-12px 0 0;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;border-top:1px solid var(--ink);padding-top:8px;font-family:var(--font-chrome);font-size:14px;line-height:18px}
.pw-cut__text{flex:1 1 260px;min-width:0}
.pw-cut .pw-btn{min-height:26px;font-size:14px;padding:0 10px}

/* DecisionRow: the decisions behind an answer, collapsed under it */
.pw-decisions{align-self:stretch;max-width:760px;margin:-12px 0 0;font-family:var(--font-chrome);font-size:13px;line-height:18px}
.pw-decisions>summary{cursor:default;display:inline-flex;gap:6px;align-items:center;list-style:none}
.pw-decisions>summary::-webkit-details-marker{display:none}
.pw-decisions ul{list-style:none;margin:6px 0 0;padding:0;border-top:1px dotted var(--ink)}
.pw-decisions li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:5px 0;border-bottom:1px dotted var(--ink);font-size:14px}
.pw-decisions li .pw-link{margin-left:auto;font-size:13px}

/* Capability picker (Project Start) */
.pw-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-family:var(--font-chrome);font-size:14px}
.pw-steps li{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 10px;border-bottom:1px dotted var(--ink)}
.pw-steps li[aria-current="step"]{background:var(--selection-bg);color:var(--selection-fg)}
.pw-steps li[data-done]::after{content:"✓";margin-left:auto}
.pw-cap{display:grid;grid-template-columns:14px 1fr;gap:2px 10px;padding:8px 2px;border-top:1px dotted var(--ink);font-family:var(--font-chrome);font-size:15px;line-height:20px}
.pw-cap small{grid-column:2;font-size:13px;line-height:18px}
.pw-cap__meta{grid-column:2;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;line-height:16px}
.pw-cap[aria-disabled="true"]{color:var(--ink-disabled)}
.pw-cap__warn{grid-column:2;display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:18px;border:1px solid var(--ink);padding:4px 8px;margin-top:4px;color:var(--ink)}
.pw-capgroup{margin:0;padding:0;border:0}
.pw-capgroup>legend{padding:10px 0 2px;font-family:var(--font-chrome);font-size:13px;font-weight:600}

/* Shortcut table */
.pw-keys{border-collapse:collapse;font-family:var(--font-chrome);font-size:14px}
.pw-keys th,.pw-keys td{border-bottom:1px dotted var(--ink);padding:5px 12px 5px 0;text-align:left;vertical-align:top}
.pw-keys th{border-bottom:1px solid var(--ink);font-size:13px}
.pw-keys kbd{font:inherit;border:1px solid var(--ink);padding:0 4px;white-space:nowrap}

@media (max-width:760px){
  .pw-cap{min-height:44px;grid-template-columns:22px 1fr;padding:10px 2px}
  .pw-cap .pw-check{width:22px;height:22px}
  .pw-cut .pw-btn{min-height:var(--size-touch);font-size:16px}
  .pw-decisions>summary{min-height:44px}
  .pw-decisions li{min-height:44px}
}

/* ThemePanel (task 312): the app's theme, edited live from the chat. Workbench UI; only the swatches carry the app's colours. */
.pw-theme .pw-card__body{gap:0;padding:0}
.pw-theme__row{display:grid;grid-template-columns:minmax(150px,1.2fr) 1fr 1fr auto;align-items:center;gap:6px 12px;padding:7px 12px;border-top:1px dotted var(--ink);font-family:var(--font-chrome);font-size:14px;line-height:18px}
.pw-theme__row:first-child{border-top:0}
.pw-theme__row--head{font-size:12px;font-weight:600;padding-top:6px;padding-bottom:6px}
.pw-theme__name small{display:block;font-size:12px;line-height:16px}
.pw-theme__val{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pw-swatch{flex:none;width:22px;height:22px;border:1px solid var(--ink);display:inline-grid;place-content:center;font-size:11px;font-weight:600;cursor:default;padding:0}
.pw-swatch[aria-expanded="true"]{outline:2px solid var(--ink);outline-offset:1px}
.pw-theme__hex{font-family:var(--font-mono);font-size:12px;width:76px;height:22px;border:1px solid var(--ink);padding:0 4px;background:var(--paper)}
.pw-contrast{font-size:12px;white-space:nowrap}
.pw-theme__reset{font:inherit;font-size:12px;background:none;border:0;padding:0;text-decoration:underline;color:inherit;cursor:default}
.pw-theme__reset:disabled{color:var(--ink-disabled);text-decoration:none}
.pw-picker{width:240px;background:var(--paper);border:1px solid var(--ink);box-shadow:var(--shadow-popup);padding:10px;display:flex;flex-direction:column;gap:8px;font-family:var(--font-chrome);font-size:13px}
.pw-picker__field{height:140px;border:1px solid var(--ink);position:relative}
.pw-picker__hue{height:12px;border:1px solid var(--ink);background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.pw-slider{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-family:var(--font-chrome);font-size:14px;padding:10px 12px}
.pw-slider input[type=range]{width:100%;accent-color:var(--ink)}
.pw-samples{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;padding:10px 12px;border-top:1px dotted var(--ink)}
@media (max-width:760px){
  .pw-theme__row{grid-template-columns:1fr auto;min-height:56px}
  .pw-swatch{width:32px;height:32px}
}
/* ---- 2026-10-18 · Round 13: the round 12 builds, revisited ---- */

/* ThemePanel · Fonts: one row per role (headings, body); the family, a search, Reset, then a sample in the app's look */
.pw-fontrow{display:grid;grid-template-columns:minmax(120px,auto) 1fr auto;gap:6px 12px;align-items:center;padding:10px 12px;border-top:1px dotted var(--ink);font-family:var(--font-chrome);font-size:14px;line-height:18px}
.pw-fontrow:first-child{border-top:0}
.pw-fontrow__family{font-family:var(--font-mono);font-size:13px}
.pw-fontrow__search{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.pw-fontrow__search .pw-field{flex:1;min-width:0;height:26px}
.pw-fontsample{grid-column:1/-1;border:1px solid var(--ink);padding:8px 10px;background:#fff;color:#0f172a;display:flex;flex-direction:column;gap:2px}
.pw-fontget{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px dotted var(--ink);padding:6px 10px;font-size:13px}
.pw-fontget__text{flex:1 1 260px;min-width:0}
/* the picker's what-am-I-editing segment */
.pw-picker .pw-seg{align-self:flex-start}
/* a theme panel folded after Save Theme */
.pw-theme--folded{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--ink);font-family:var(--font-chrome);font-size:14px}
/* test output under a failed Create */
.pw-output{margin:0;border:1px dotted var(--ink);padding:8px 10px;font-family:var(--font-mono);font-size:12px;line-height:17px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto}
@media (max-width:760px){
  .pw-fontrow{grid-template-columns:1fr auto;min-height:44px}
  .pw-fontrow__search .pw-field{height:44px}
}
/* ---- 2026-10-20 · Round 17 A: Overview · All Projects (plan 354): attention, projects, recorded problems, entry points ---- */

/* WorkOverview: the window body. Lists on the left, the Ask across projects pane (400 px) on the right */
.pw-overview{display:flex;flex:1;min-height:0}
.pw-overview__main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto}
.pw-overview__ask{flex:none;width:400px;border-left:3px double var(--ink);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.pw-overview__askhead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ink);font-family:var(--font-chrome);font-size:14px}
.pw-overview__askhead h2{margin:0;font:inherit;font-weight:600;flex:1}
.pw-overview__askbody{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;justify-content:flex-end}

/* Freshness, at the start of the toolbar: Live / Not connected / Reconnected / Loading */
.pw-fresh{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-chrome);font-size:14px;white-space:nowrap}
.pw-fresh[data-state="stale"]{border:1px dotted var(--ink);padding:1px 6px}
.pw-fresh[data-state="reconnected"]{border:1px solid var(--ink);padding:1px 6px}
.pw-fresh__dot{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none}
.pw-fresh[data-state="stale"] .pw-fresh__dot,.pw-fresh[data-state="loading"] .pw-fresh__dot{background:none;border:1px dotted var(--ink)}

/* Sections: Needs you, Projects, Recorded problems */
.pw-ovsec{border-bottom:1px solid var(--ink)}
.pw-ovsec__head{display:flex;align-items:baseline;gap:8px;padding:10px 16px 6px;font-family:var(--font-chrome)}
.pw-ovsec__title{margin:0;font-size:15px;font-weight:600}
.pw-ovsec__count{font-size:13px}
.pw-ovsec__note{margin-left:auto;font-size:13px}
.pw-ovsec__empty{margin:0;padding:4px 16px 12px;font-family:var(--font-chrome);font-size:14px}
.pw-ovsec__toggle{font:inherit;font-weight:600;font-size:15px;color:inherit;background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:6px;cursor:default}
.pw-ovsec__toggle:focus-visible,.pw-ovsec__title:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* AttentionItem: one link per item (the whole row), kind word first, the Open… label at the end */
.pw-attnlist{list-style:none;margin:0;padding:0 8px 8px;display:flex;flex-direction:column}
.pw-attn{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:2px 14px;align-items:start;padding:8px 8px;border-top:1px dotted var(--ink);color:var(--ink);text-decoration:none;font-family:var(--font-chrome);font-size:14px;line-height:18px}
.pw-attnlist>li:first-child .pw-attn{border-top:0}
.pw-attn:hover{background:var(--wash)}
.pw-attn:focus-visible,.pw-attn[data-focus]{outline:2px solid var(--ink);outline-offset:-2px}
.pw-attn[aria-current="true"]{background:var(--selection-bg);color:var(--selection-fg)}
.pw-attn__kind{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.pw-attn__where{display:flex;flex-wrap:wrap;gap:0 8px;min-width:0}
.pw-attn__project{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pw-attn__req{white-space:nowrap}
.pw-attn__text{grid-column:2/3;margin:0;font-family:var(--font-text);font-size:15px;line-height:20px}
.pw-attn__end{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:flex-end;gap:4px;white-space:nowrap}
.pw-attn__open{border:1px solid currentColor;padding:0 8px;line-height:20px}
.pw-attn[data-stale] .pw-attn__kind{font-weight:400}
.pw-attn[data-stale] .pw-attn__open{border-style:dotted}
.pw-attn[data-replaced] .pw-attn__text{font-style:italic}
.pw-attn[data-leaving]{opacity:.45}

/* Project rows: a grid of two cells per row: the row link (everything recorded about the project) and Open in Activity */
.pw-plist{display:flex;flex-direction:column;padding:0 8px 8px}
.pw-prow{display:flex;align-items:center;gap:10px;padding:0 8px;border-top:1px dotted var(--ink);font-family:var(--font-chrome);font-size:14px;line-height:18px;color:var(--ink)}
.pw-plist>.pw-prow:first-child{border-top:0}
.pw-prow__cellwrap{flex:1;min-width:0;display:flex}
.pw-prow__main{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 168px auto;gap:2px 12px;align-items:center;padding:7px 4px;color:inherit;text-decoration:none}
.pw-prow__main:hover{background:var(--wash)}
.pw-prow__main:focus-visible,.pw-prow__main[data-focus]{outline:2px solid var(--ink);outline-offset:-2px}
.pw-prow__name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-prow__badge{justify-self:end}
.pw-prow__cell{display:inline-flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.pw-prow__cell>span{overflow:hidden;text-overflow:ellipsis}
.pw-prow__latest{grid-column:1/4;font-size:13px}
.pw-prow__unknown{font-style:italic}
.pw-prow__act{flex:none;font:inherit;font-size:13px;color:inherit;background:var(--paper);border:1px solid var(--ink);padding:0 8px;height:22px;white-space:nowrap;cursor:default}
.pw-prow__act:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pw-prow[data-stale] .pw-prow__main{background-image:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 4px);background-size:100% 1px;background-repeat:no-repeat;background-position:left bottom}
.pw-prow[data-missing] .pw-prow__name{font-style:italic;font-weight:400}

/* Badge "Needs you · 1": the one inverse mark on a row */
.pw-needs{display:inline-flex;align-items:center;gap:4px;background:var(--ink);color:var(--paper);font-family:var(--font-chrome);font-size:12px;line-height:16px;padding:1px 6px;white-space:nowrap}
.pw-needs--plain{background:none;color:var(--ink);border:1px solid var(--ink)}

/* Recorded problems: collapsed history, never actionable */
.pw-hist{list-style:none;margin:0;padding:0 16px 10px;display:flex;flex-direction:column;font-family:var(--font-chrome);font-size:14px;line-height:18px}
.pw-hist li{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:10px;padding:6px 0;border-top:1px dotted var(--ink)}
.pw-hist li:first-child{border-top:0}
.pw-hist__state{display:inline-flex;align-items:center;gap:6px}

/* Live announcement line (visible copy of the polite region, for the boards) */
.pw-ovlive{margin:0;padding:4px 16px;font-family:var(--font-chrome);font-size:13px;border-bottom:1px dotted var(--ink);display:flex;gap:8px;align-items:center}

/* Entry points: the Agent section's Overview row, the return link in project chat */
.pw-return{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-chrome);font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--ink);padding:0 8px;height:22px;background:var(--paper)}
.pw-return:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Synthetic records (proposed later): a hatched frame marks them as not shipped */
.pw-synthetic{border:1px dashed var(--ink);padding:10px 12px;background-color:var(--paper);background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--wash) 6px 7px)}
.pw-agentrun{display:grid;grid-template-columns:160px minmax(0,1fr) 170px;gap:10px;padding:4px 0 4px 24px;font-family:var(--font-chrome);font-size:14px;border-top:1px dotted var(--ink)}

/* Drawn modifiers (the boards draw these sizes inside wider canvases; the app uses the media queries below) */
.pw-ov--narrow .pw-attn{grid-template-columns:minmax(0,1fr);gap:2px}
.pw-ov--narrow .pw-attn__text{grid-column:1}
.pw-ov--narrow .pw-attn__end{order:1;grid-row:auto;grid-column:1;flex-direction:row;justify-content:space-between;align-items:center}
.pw-ov--narrow .pw-prow{flex-wrap:wrap;padding:4px 8px}
.pw-ov--narrow .pw-prow__main{grid-template-columns:minmax(0,1fr) auto}
.pw-ov--narrow .pw-prow__main>*{grid-column:1}
.pw-ov--narrow .pw-prow__main>.pw-prow__badge{grid-column:2;grid-row:1}
.pw-ov--narrow .pw-prow__cellside{flex-basis:100%;display:flex;justify-content:flex-end;padding-bottom:6px}
.pw-ov--narrow .pw-hist li{grid-template-columns:minmax(0,1fr)}
.pw-ov--phone .pw-attn,.pw-ov--phone .pw-prow__main{min-height:var(--size-touch);font-size:15px}
.pw-ov--phone .pw-attn__open{line-height:28px;padding:0 10px}
.pw-ov--phone .pw-prow__act{height:var(--size-touch);padding:0 12px}
.pw-ov--phone .pw-ovsec__head{min-height:40px;align-items:center}

/* 1024: the Ask pane is a toggle that replaces the lists */
@media (max-width:1180px){
  .pw-overview__ask{display:none;width:auto;flex:1;border-left:0}
  .pw-overview[data-ask="open"] .pw-overview__ask{display:flex}
  .pw-overview[data-ask="open"] .pw-overview__main{display:none}
}
/* narrow content (≤ 560 px, e.g. 320) and phone (≤ 760 px): the same rules as .pw-ov--narrow and .pw-ov--phone */
@media (max-width:560px){
  .pw-attn{grid-template-columns:minmax(0,1fr);gap:2px}
  .pw-attn__text{grid-column:1}
  .pw-attn__end{order:1;grid-row:auto;grid-column:1;flex-direction:row;justify-content:space-between;align-items:center}
  .pw-prow{flex-wrap:wrap}
  .pw-prow__main{grid-template-columns:minmax(0,1fr) auto}
  .pw-prow__main>*{grid-column:1}
  .pw-prow__main>.pw-prow__badge{grid-column:2;grid-row:1}
  .pw-prow__cellside{flex-basis:100%;display:flex;justify-content:flex-end;padding-bottom:6px}
  .pw-hist li{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .pw-overview__ask{display:none}
  .pw-attn,.pw-prow__main{min-height:var(--size-touch);font-size:15px}
  .pw-attn__open{line-height:28px;padding:0 10px}
  .pw-prow__act{height:var(--size-touch);padding:0 12px}
}
.pw-prow[data-missing] .pw-prow__latest{white-space:normal}
</style>
