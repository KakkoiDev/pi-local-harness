<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projects window component</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/0bee260e58c72bbc496b29ca68796cdc">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="height: {{h}}; display: flex">
<section class="{{winClass}}" aria-label="Projects" style="flex: 1; min-width: 0">
<div class="pw-titlebar"><button class="pw-box" aria-label="Close window"></button><div class="pw-titlebar__stripes"></div><h2 class="pw-titlebar__title">Projects</h2><div class="pw-titlebar__stripes"></div><button class="pw-box pw-box--zoom" aria-label="Zoom window"></button></div>
<div class="pw-infobar" style="justify-content: space-between"><span>{{projectCount}}</span><span>on this Mac</span></div>
<div style="padding: 10px; border-bottom: 1px solid #000"><label class="pw-search"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 10l4.5 4.5" stroke="currentColor" stroke-width="2"/></svg><input type="search" aria-label="Find a project" placeholder="Find a project"><kbd class="pw-kbd">⌘K</kbd></label></div>
<nav class="pw-window__body" aria-label="Projects and agent">
<section class="pw-group" aria-labelledby="pg-projects"><div class="pw-group__head"><h3 class="pw-group__title" id="pg-projects"><button class="pw-group__toggle" aria-expanded="true" aria-controls="pg-projects-body"><svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><path d="M3.5 5h9l-4.5 6z" fill="currentColor"/></svg>Projects<span class="pw-group__count">{{projectN}}</span></button></h3></div>
<div class="pw-group__body" id="pg-projects-body" role="list">
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><p class="pw-group__empty">Your projects will appear here.</p></sc-if>
<sc-for list="{{projects}}" as="p" hint-placeholder-count="3"><a href="{{p.href}}" class="pw-row" role="listitem" aria-current="{{p.current}}"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M.5 3.5h5l1.5 1.5h8.5v9.5H.5z" fill="none" stroke="currentColor"/></svg><span class="pw-row__label">{{p.name}}</span><span class="pw-row__meta"><sc-if value="{{p.run}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M2.5.5h11M2.5 15.5h11M3.5.5c0 5 4.5 5 4.5 7.5s-4.5 2.5-4.5 7.5M12.5.5c0 5-4.5 5-4.5 7.5s4.5 2.5 4.5 7.5" fill="none" stroke="currentColor"/></svg></sc-if><sc-if value="{{p.warn}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 .8 15.4 14.5H.6z" fill="none" stroke="currentColor"/><path d="M8 5.5v4.5M8 11.5v1.5" stroke="currentColor" stroke-width="1.5"/></svg></sc-if>{{p.meta}}</span></a></sc-for>
</div></section>
<section class="pw-group" aria-labelledby="pg-agent"><div class="pw-group__head"><h3 class="pw-group__title" id="pg-agent"><button class="pw-group__toggle" aria-expanded="true" aria-controls="pg-agent-body"><svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><path d="M3.5 5h9l-4.5 6z" fill="currentColor"/></svg>Agent<span class="pw-group__count">All projects</span></button></h3></div>
<div class="pw-group__body" id="pg-agent-body" role="list">
<a href="Activity.dc.html" class="pw-row" role="listitem" aria-current="{{actCurrent}}" aria-keyshortcuts="Meta+3"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1 3h2v2H1zM1 7h2v2H1zM1 11h2v2H1z" fill="currentColor"/><path d="M5 4h10M5 8h10M5 12h10" stroke="currentColor"/></svg><span class="pw-row__label">Activity</span><span class="pw-row__meta"><sc-if value="{{actRun}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M2.5.5h11M2.5 15.5h11M3.5.5c0 5 4.5 5 4.5 7.5s-4.5 2.5-4.5 7.5M12.5.5c0 5-4.5 5-4.5 7.5s4.5 2.5 4.5 7.5" fill="none" stroke="currentColor"/></svg></sc-if><sc-if value="{{actWarn}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 .8 15.4 14.5H.6z" fill="none" stroke="currentColor"/><path d="M8 5.5v4.5M8 11.5v1.5" stroke="currentColor" stroke-width="1.5"/></svg></sc-if>{{actMeta}}</span></a>
<a href="Gate.dc.html" class="pw-row" role="listitem" aria-current="{{gateCurrent}}" aria-keyshortcuts="Meta+4"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2.5 1v14M13.5 1v14M2.5 4.5h11M2.5 9.5h11" fill="none" stroke="currentColor"/><path d="M5 4.5v5M8 4.5v5M11 4.5v5" stroke="currentColor"/></svg><span class="pw-row__label">Gate</span><span class="pw-row__meta"><sc-if value="{{gateBlock}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M5 .5h6L15.5 5v6L11 15.5H5L.5 11V5z" fill="currentColor"/></svg></sc-if>{{gateMeta}}</span></a>
</div></section>
</nav>
<div style="flex: none; border-top: 1px solid #000; padding: 12px 10px; display: flex; flex-direction: column; gap: 8px">
<a href="Dialogs.dc.html" class="pw-btn" style="justify-content: space-between">New Project…<span class="pw-kbd">⌘N</span></a>
<a href="Dialogs2.dc.html" class="pw-btn" style="justify-content: space-between">Add Existing Folder…<span class="pw-kbd">⌘O</span></a>
</div>
<div class="pw-statusbar" style="justify-content: space-between"><span>Local AI</span><span>Nothing leaves this Mac</span></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"agent": {"editor": "enum", "options": ["working", "idle", "attention"], "default": "working"}, "current": {"editor": "enum", "options": ["none", "project", "activity", "gate"], "default": "none"}, "empty": {"editor": "boolean", "default": false}, "active": {"editor": "boolean", "default": false}, "h": {"editor": "text", "default": "824px"}, "$preview": {"width": 290, "height": 824}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.agent ?? 'working', c = this.props.current ?? 'none', empty = !!this.props.empty;
const P = (name, o) => Object.assign({ name: name, href: 'Main.dc.html', current: 'false', run: false, warn: false, meta: '' }, o || {});
const projects = empty ? [] : [
 P('pi-local-harness', { current: c === 'project' ? 'page' : 'false', run: a === 'working', meta: a === 'working' ? 'running' : '' }),
 P('Japanese study app', { meta: a === 'working' ? 'waiting' : '' }),
 P('home-server', { warn: a === 'attention', meta: a === 'attention' ? 'failed' : '' })
];
const act = { working: '1 running · 1 waiting', idle: 'Nothing running', attention: '1 needs attention' }[a];
const gate = { working: '12 checks · 1 blocked', idle: '12 checks today', attention: '14 checks · 1 blocked' }[a];
return {
h: this.props.h ?? '824px',
winClass: 'pw-window' + (this.props.active ? '' : ' pw-window--inactive'),
projects: projects, empty: empty,
projectCount: empty ? 'No projects' : '3 projects', projectN: empty ? '0' : '3',
actCurrent: c === 'activity' ? 'page' : 'false', gateCurrent: c === 'gate' ? 'page' : 'false',
actRun: !empty && a === 'working', actWarn: !empty && a === 'attention',
actMeta: empty ? 'Nothing yet' : act,
gateBlock: !empty && a !== 'idle', gateMeta: empty ? 'No checks yet' : gate
};
}
}
</script>
</body>
</html>
