/* PreviewWindow: the project's own app, live, in a window beside the chat (a view when the chat would drop under 480px). */
.pw-preview{display:flex;flex-direction:column;min-width:0}
.pw-address{flex:1 1 160px;min-width:0;display:flex;align-items:center;gap:6px;height:30px;border:1px solid var(--ink);box-shadow:var(--shadow-field);background:var(--paper);padding:0 8px;font-family:var(--font-mono);font-size:13px}

.pw-preview__frame>iframe{display:block;border:0;width:100%;height:100%}
.pw-preview__frame[data-scaled]>*{transform-origin:0 0}

.pw-preview--dim .pw-preview__stage,.pw-preview--dim .pw-toolbar,.pw-preview--dim .pw-statusbar{color:var(--ink-disabled)}
.pw-preview__foot{flex:none;border-top:1px solid var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 12px;font-family:var(--font-chrome);font-size:13px}
.pw-preview__foot .pw-btn{min-height:26px;font-size:14px;padding:0 10px}

/* DoneRow: under each finished answer, what was done in plain words; the request is one commit. */
.pw-done{align-self:stretch;max-width:760px;margin:-12px 0 0;border-top:1px solid var(--ink);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.pw-done__head{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-family:var(--font-chrome);font-size:13px;line-height:18px}

.pw-done__actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.pw-done__actions .pw-btn{min-height:26px;font-size:14px;padding:0 10px}

/* LessonLine: at most one per answer, when the person meets an idea for the first time. */
.pw-lesson{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;border-top:1px dotted var(--ink);padding-top:6px;font-family:var(--font-chrome);font-size:13px;line-height:18px}
.pw-lesson__hide{margin-left:auto;font:inherit;color:inherit;background:none;border:0;padding:0 2px;text-decoration:underline;text-underline-offset:2px;cursor:default}

@media (max-width:760px){
  .pw-address{height:44px;font-size:15px}
  .pw-done__actions .pw-btn,.pw-preview__foot .pw-btn{min-height:var(--size-touch);font-size:16px}
  .pw-lesson__hide{min-height:44px}
  .pw-preview__stage{padding:0}
  .pw-preview__frame{border:0;box-shadow:none}
}
.pw-seg>[disabled]{color:var(--ink-disabled)}
/* Radio: a 14px circle, an 8px dot when chosen. Used by New Project's kind. */
.pw-radio{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1px solid var(--ink);border-radius:50%;background:var(--paper);margin:3px 0 0;display:inline-grid;place-content:center;flex:none}
.pw-radio:checked::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.pw-choice{display:grid;grid-template-columns:14px 1fr;gap:2px 10px;align-items:start;padding:6px 0;font-family:var(--font-chrome);font-size:15px;line-height:20px}
.pw-choice small{grid-column:2;display:block;font-size:13px;line-height:18px}
.pw-lines{margin:6px 0 0;padding:0;list-style:none;font-family:var(--font-mono);font-size:12px;line-height:1.6}
.pw-lines li{display:flex;gap:12px}.pw-lines li span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
