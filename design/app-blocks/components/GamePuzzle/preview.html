<figure class="ab-frame" data-device="desktop"><figcaption>Desktop · English · match-3, keyboard</figcaption><div class="ab-screen app " style=""><div class="game" data-device="keyboard" style="--g-ink: #0b0b12; --g-paper: #fbf5ea; --g-panel: #1f2a5c; --g-text: #fbf5ea; --g-dim: #c5c7cf; --g-accent: #ffae1a; --g-good: #2ee66b; --g-bad: #ff3b5c; --g-energy: #3aa8ff; width:800px; height:450px; "><canvas id="cd" style="width:100%;height:100%"></canvas><div class="game-layer"><div class="game-hud" style="grid-template-columns:200px 1fr 200px"><div data-slot="tl" class="grid gap-2"><span class="game-h">Goal</span><span class="game-row"><i style="width:12px;height:12px;border-radius:50%;background:var(--g-bad)"></i>Clear 20 red · 14 left</span><span class="game-num" style="font-size:20px">SCORE 4,820</span></div><div data-slot="tr" class="grid justify-items-end gap-1"><span class="game-num" style="font-size:22px">12</span><span class="game-small" style="color:inherit">MOVES LEFT</span></div><div data-slot="bl" class="grid gap-2" style="pointer-events:auto"><button class="game-btn"><span data-for="keyboard"><kbd class="game-key">Z</kbd></span> <span>Undo</span></button><button class="game-btn"><span data-for="keyboard"><kbd class="game-key">R</kbd></span> <span>Restart</span></button></div><div data-slot="tc"><span class="game-combo">COMBO ×3</span></div></div></div></div></div></figure><figure class="ab-frame" data-device="phone" lang="ja"><figcaption>Phone · 日本語 · portrait, swipe</figcaption><div class="ab-screen app " style=""><div class="game" data-device="touch" lang="ja" style="--g-ink: #0b0b12; --g-paper: #fbf5ea; --g-panel: #1f2a5c; --g-text: #fbf5ea; --g-dim: #c5c7cf; --g-accent: #ffae1a; --g-good: #2ee66b; --g-bad: #ff3b5c; --g-energy: #3aa8ff; width:388px; height:640px; "><canvas id="cp" style="width:100%;height:100%"></canvas><div class="game-layer"><div class="game-hud"><div data-slot="tl" class="grid"><span class="game-small" style="color:inherit">赤を 20 こ消す</ s</b><span class="text-muted-foreground text-xs font-mono">LevelSelect</span></div><span class="text-muted-foreground" aria-hidden="true">→</span><div class="grid gap-0.5 rounded-md border px-3 py-2 text-sm"><b class="font-medium">Puzzle</b><span class="text-muted-foreground text-xs font-mono">HudPieces</span></div><span class="text-muted-foreground" aria-hidden="true">→</span><div class="grid gap-0.5 rounded-md border px-3 py-2 text-sm"><b class="font-medium">Solved</b><span class="text-muted-foreground text-xs font-mono">ResultsScores</span></div><span class="text-muted-foreground" aria-hidden="true">→</span><div class="grid gap-0.5 rounded-md border px-3 py-2 text-sm"><b class="font-medium">Out of moves</b><span class="text-muted-foreground text-xs font-mono">GameOver</span></div></div></div></figure>

<script>
const PAL={"meadow": {"k": "#1b1c2b", "p": "#2b2d42", "q": "#4a4e69", "d": "#9aa0b8", "w": "#f4efe1", "y": "#f2b33d", "o": "#c27c2c", "r": "#e05a47", "R": "#9e3a3a", "g": "#5bb85d", "G": "#3a7d44", "l": "#a7d86d", "b": "#4aa3df", "B": "#2f6a9e", "s": "#f0b48a", "n": "#7a5236", "Q": "#9aa0b8"}, "dusk": {"k": "#0f0e17", "p": "#241e3a", "q": "#3d3363", "Q": "#6c5f9e", "d": "#a99ad6", "w": "#f5ecff", "y": "#ffb86b", "o": "#c9743e", "r": "#ff5c7a", "R": "#a3324f", "g": "#5ee6b0", "G": "#2f9e7d", "b": "#59c3ff", "B": "#2f6fb8", "s": "#e8b4a0", "n": "#6b4a3a", "l": "#f5ecff"}, "arcade": {"k": "#0b0b12", "p": "#1f2a5c", "q": "#5a5560", "d": "#c5c7cf", "w": "#fbf5ea", "y": "#ffae1a", "r": "#ff3b5c", "R": "#7a2a6b", "g": "#2ee66b", "G": "#0f8a5f", "b": "#3aa8ff", "n": "#a8552f", "s": "#a8552f", "B": "#1f2a5c", "l": "#2ee66b", "o": "#a8552f", "Q": "#c5c7cf"}, "ink": {"k": "#111111", "q": "#3d3d3d", "d": "#aaaaaa", "w": "#f2f2ec", "p": "#3d3d3d", "r": "#aaaaaa", "R": "#3d3d3d", "g": "#aaaaaa", "G": "#3d3d3d", "l": "#f2f2ec", "y": "#f2f2ec", "o": "#aaaaaa", "b": "#aaaaaa", "B": "#3d3d3d", "s": "#f2f2ec", "n": "#3d3d3d", "Q": "#aaaaaa"}}, SPR={"hero": ["................", ".....kkkkkk.....", "....knnnnnnk....", "...knnnnnnnnk...", "...knnsssssnk...", "...knskssksnk...", "....ksssssssk...", ".....ksssssk....", "....kkrrrrrkk...", "...ksrrryrrRsk..", "...ksrRyyyRRsk..", "...kkrrrrrRRkk..", "....kBBBkBBBk...", "....kBBBkBBBk...", "....knnnknnnk...", "....kkkk.kkkk..."], "slime": ["................", "................", "................", "................", "......kkkk......", "....kkggggkk....", "...kgllggggGk...", "..kglggggggGGk..", "..kgggwkggwkGk..", ".kggggkkggkkgGk.", ".kgggggggggggGk.", ".kggggggggggGGk.", ".kGgggggggggGGk.", "..kGGGGGGGGGGk..", "...kkkkkkkkkk...", "................"], "potion": ["................", "......kkkk......", "......knnk......", "......kkkk......", ".......kwk......", ".......kwk......", "......kwwwk.....", ".....kwwwwwk....", "....kwrrrrrwk...", "....krwrrrrRk...", "....krrrrrrRk...", "....krrrrrRRk...", ".....kRRRRRk....", "......kkkkk.....", "................", "................"], "grass": ["gggggggggggggggg", "gglggggggggGgggg", "gglGgggggggGlggg", "ggggggggggggggGg", "ggggGggggggggggg", "gggGlgggglgggggg", "gggggggggGlggggg", "gggggggggggggggg", "gGgggggggggggglg", "glggggggggggggGg", "gggggggGgggggggg", "ggggggglgggggggg", "gggggggggggGgggg", "gggglgggggglGggg", "ggggGggggggggggg", "gggggggggggggggg"], "heart": ["................", "................", "...kkk....kkk...", "..krrrk..krrrk..", ".krwwrrkkrrrrRk.", ".krwrrrrrrrrrRk.", ".krrrrrrrrrrrRk.", ".krrrrrrrrrrRRk.", "..krrrrrrrrRRk..", "...krrrrrrRRk...", "....krrrrRRk....", ".....krrRRk.....", "......krRk......", ".......kk.......", "................", "................"], "coin": ["................", "................", ".....kkkkkk.....", "....kyyyyyyk....", "...kywwyyyyok...", "...kywyyooyok...", "...kyyyoyyyok...", "...kyyyoyyyok...", "...kyyyoyyyok...", "...kyyyooyyok...", "...kyyyyyyook...", "....kooooook....", ".....kkkkkk.....", "................", "................", "................"], "ship": [".......kk.......", "......kwwk......", "......kbbk......", ".....kbwwbk.....", ".....kbwwbk.....", "....kbbbbbbk....", "...kBbbbbbbBk...", "..kBbbbyybbbBk..", ".kBbbbbyybbbbBk.", ".kBBkbbbbbbkBBk.", ".kkk.kbbbbk.kkk.", ".....kBBBBk.....", "......kyyk......", "......kryk......", ".......kk.......", "................"], "button9": ["..kkkkkkkk..", ".kwwwwwwwwk.", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kooooooooook", ".kooooooook.", "..kkkkkkkk.."], "frame9": [".kkkkkkkkkk.", "kwwwwwwwwwwk", "kwqqqqqqqqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqqqqqqqqdk", "kddddddddddk", ".kkkkkkkkkk."]};
function grid(name,pal,swap){const p=Object.assign({},PAL[pal||'meadow'],swap||{});return SPR[name].map(r=>[...r].map(c=>c==='.'?null:p[c]||c))}
function blit(ctx,g,x,y,s,flip){s=s||1;for(let j=0;j<g.length;j++)for(let i=0;i<g[j].length;i++){const c=g[j][flip?g[j].length-1-i:i];if(c){ctx.fillStyle=c;ctx.fillRect(x+i*s,y+j*s,s,s)}}}
function sprite(ctx,name,x,y,s,pal,swap,flip){blit(ctx,grid(name,pal,swap),x,y,s,flip)}
function canvasOf(id,w,h){const c=document.getElementById(id);c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return x}
function rect(ctx,c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}


const P = (pid) => PAL[pid];
function tiles(x, name, W, H, pal, swap) { for (let j=0;j<H;j+=16) for (let i=0;i<W;i+=16) sprite(x, name, i, j, 1, pal, swap); }
function stars(x, W, H, c, n, seed) { let s = seed||7; for (let i=0;i<n;i++) { s=(s*9301+49297)%233280; const a=s/233280; s=(s*9301+49297)%233280; const b=s/233280; rect(x, c, Math.floor(a*W), Math.floor(b*H), 1, 1); } }
function tree(x, cx, cy, pal) { const p=PAL[pal||'meadow']; rect(x,p.k,cx-6,cy-11,13,11); rect(x,p.G,cx-5,cy-10,11,9); rect(x,p.g,cx-5,cy-10,7,5); rect(x,p.l,cx-4,cy-9,2,2); rect(x,p.k,cx-2,cy,5,5); rect(x,p.n,cx-1,cy,3,4); }
function circle(x, c, cx, cy, r, stroke) { x.save(); x.beginPath(); x.arc(cx, cy, r, 0, Math.PI*2); if (stroke) { x.strokeStyle=c; x.lineWidth=1; x.stroke(); } else { x.fillStyle=c; x.fill(); } x.restore(); }
function scene(id, W, H, fn) { const x = canvasOf(id, W, H); fn(x, W, H); }
const draw = (x, W, H) => { const p = PAL.arcade; rect(x, p.p, 0, 0, W, H); const n = 7, cell = Math.floor(Math.min(W - 8, H - 50) / n), gx = Math.floor((W - cell*n)/2), gy = Math.floor((H - cell*n)/2) + (H > W ? 4 : 0);
  const cols = [p.r, p.b, p.y, p.g, p.R]; rect(x, p.k, gx-2, gy-2, cell*n+4, cell*n+4);
  for (let j=0;j<n;j++) for (let i=0;i<n;i++) { const t = (i*7 + j*3 + (i*j)%5) % 5, cx = gx + i*cell, cy = gy + j*cell, s = cell - 2; rect(x, (i+j)%2 ? p.p : p.k, cx, cy, cell, cell);
    x.fillStyle = cols[t]; x.beginPath(); const m = cx + 1 + s/2, mm = cy + 1 + s/2, r = s*0.4;
    if (t===0) x.arc(m, mm, r, 0, 7); else if (t===1) x.rect(m-r, mm-r, 2*r, 2*r); else if (t===2) { x.moveTo(m, mm-r); x.lineTo(m+r, mm); x.lineTo(m, mm+r); x.lineTo(m-r, mm); } else if (t===3) { x.moveTo(m, mm-r); x.lineTo(m+r, mm+r); x.lineTo(m-r, mm+r); } else { for (let k=0;k<6;k++) { const a = k*Math.PI/3; x[k?'lineTo':'moveTo'](m + r*Math.cos(a), mm + r*Math.sin(a)); } }
    x.fill(); rect(x, p.w, Math.floor(m - r/2), Math.floor(mm - r/2), 1, 1); }
  x.strokeStyle = p.y; x.lineWidth = 1; x.strokeRect(gx + 3*cell + .5, gy + 2*cell + .5, cell*2 - 1, cell - 1); };
scene('cd', 200, 112, draw); scene('cp', 97, 160, draw); scene('cs', 97, 75, draw);
