</div>
</div>
</figure>
<figure class="ab-frame" data-device="state">
<figcaption>Empty</figcaption>
<div class="ab-screen app">
<div class="p-4">

</div>
</div>
</figure>

<figcaption>Loading</figcaption>
<div class="ab-screen app">
<div class="p-4">
<div class="grid gap-2" aria-busy="true"><div class="skeleton h-14"></div><div class="skeleton h-14"></div><div class="skeleton h-14"></div></div>
</div>
</div>

</div>
