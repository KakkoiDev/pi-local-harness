n><span>削除</span></span><span class="game-row"><span data-for="keyboard"><span class="game-key">Esc</span></span><span data-for="mouse"><span class="game-key">Esc</span></span><span data-for="gamepad"><span class="game-padpos" data-pos="east" aria-label="east button"></span></span><span>戻る</span></span></p></div></section></div></div></div></figure>

pan>Delete</span></span><span class="game-row"><span data-for="keyboard"><span class="game-key">Esc</span></span><span data-for="mouse"><span class="game-key">Esc</span></span><span data-for="gamepad"><span class="game-padpos" data-pos="east" aria-label="east button"></span></span><span>Back</span></span></p></div></section><div class="game-overlay" style="background:rgb(10 10 20 / .5)"><div class="game-panel" data-tone="light" style="display:grid;gap:10px;width:min(320px,100%)"><p class="game-line" style="margin:0">Save over Slot 1? The old save is replaced.</p><div class="game-row" style="justify-content:flex-end"><button class="game-btn" data-selected="true">Cancel</button><button class="game-btn" data-variant="solid">Overwrite</button></div></div></div></div></div></div></figure>
</div>
<script>
(function(){
const P={ink:'#1b1c2b',paper:'#f4efe1',panel:'#2b2d42',dim:'#9aa0b8',accent:'#f2b33d',good:'#5bb85d',bad:'#e05a47',energy:'#4aa3df',sky:'#8fd0f0',grass:'#5bb85d',grass2:'#4a9e4f',dirt:'#c58a4e',stone:'#6b6f86',night:'#141526'};
function r(x,c,X,Y,W,H){x.fillStyle=c;x.fillRect(X,Y,W,H);}
function hero(x,X,Y){r(x,P.ink,X,Y,8,10);r(x,P.paper,X+1,Y+1,6,4);r(x,P.ink,X+2,Y+2,1,1);r(x,P.ink,X+5,Y+2,1,1);r(x,P.energy,X+1,Y+5,6,3);r(x,P.dirt,X+1,Y+8,2,2);r(x,P.dirt,X+5,Y+8,2,2);r(x,P.accent,X+1,Y,6,1);}
function slime(x,X,Y){r(x,P.ink,X,Y+2,10,6);r(x,P.ink,X+2,Y,6,2);r(x,P.bad,X+1,Y+3,8,4);r(x,P.bad,X+3,Y+1,4,2);r(x,P.paper,X+3,Y+4,1,1);r(x,P.paper,X+6,Y+4,1,1);}
function tree(x,X,Y){r(x,P.ink,X+3,Y+10,4,6);r(x,P.dirt,X+4,Y+10,2,5);r(x,P.ink,X,Y,10,11);r(x,P.grass2,X+1,Y+1,8,9);r(x,P.good,X+2,Y+2,4,3);}
function coin(x,X,Y){r(x,P.ink,X,Y,4,4);r(x,P.accent,X+1,Y+1,2,2);}
function ship(x,X,Y){r(x,P.ink,X+3,Y,4,10);r(x,P.paper,X+4,Y+1,2,7);r(x,P.ink,X,Y+5,10,4);r(x,P.energy,X+1,Y+6,8,2);r(x,P.accent,X+4,Y+10,2,2);}
function draw(c){
 const k=c.dataset.scene||'meadow',W=+c.width,H=+c.height,x=c.getContext('2d');x.imageSmoothingEnabled=false;
 if(k==='space'){r(x,P.night,0,0,W,H);for(let i=0;i<70;i++){r(x,i%5?P.dim:P.paper,(i*53)%W,(i*29+i*i)%H,1,1);}ship(x,W/2-5|0,H-22);slime(x,30,18);slime(x,W-50,26);for(let i=0;i<4;i++)r(x,P.accent,W/2-1|0,H-30-i*9,2,4);return;}
 if(k==='dungeon'){r(x,P.night,0,0,W,H);for(let y=0;y<H;y+=8)for(let X=0;X<W;X+=8){r(x,((X+y)/8)%2?'#23253a':'#1d1f31',X,y,8,8);}r(x,P.stone,0,0,W,10);r(x,P.ink,0,10,W,2);hero(x,W/2-4|0,H/2);slime(x,W/2+20|0,H/2-10|0);coin(x,30,H-30);return;}
 if(k==='board'){r(x,'#1f3a33',0,0,W,H);for(let i=0;i<W;i+=4)r(x,'#234238',i,0,2,H);r(x,P.ink,W/2-60,H/2-24,120,2);return;}
 if(k==='title'){r(x,P.sky,0,0,W,H);r(x,'#b7e3f5',0,0,W,H/3|0);r(x,P.paper,20,14,16,4);r(x,P.paper,24,11,8,3);r(x,P.paper,W-50,22,18,4);
  r(x,P.grass2,0,H*0.62|0,W,H);for(let X=0;X<W;X+=12){r(x,P.grass2,X,(H*0.58|0)-(X%24?2:5),12,8);}r(x,P.grass,0,H*0.72|0,W,H);
  tree(x,14,(H*0.72|0)-14);tree(x,W-30,(H*0.72|0)-16);hero(x,W/2-4|0,(H*0.72|0)-9);return;}
 // meadow (default): top-down field
 r(x,P.grass,0,0,W,H);for(let y=0;y<H;y+=8)for(let X=0;X<W;X+=8){if(((X*7+y*13)/8)%5<1)r(x,P.grass2,X+2,y+3,2,1);}
 r(x,P.dirt,0,(H/2|0)+4,W,10);r(x,'#b97c42',0,(H/2|0)+6,W,1);
 for(let X=6;X<W;X+=46){tree(x,X,6);} for(let X=26;X<W;X+=58){tree(x,X,H-20);}
 hero(x,W/2-4|0,(H/2|0)-2);slime(x,(W/2|0)+30,(H/2|0)-14);coin(x,(W/2|0)-34,(H/2|0)+6);coin(x,(W/2|0)-26,(H/2|0)+6);
 r(x,'#4aa3df',W-40,H-36,26,14);r(x,'#7ec4e8',W-36,H-33,8,2);
}
document.querySelectorAll('canvas[data-scene]').forEach(draw);
})();
</script>
