        <p class="text-destructive text-sm" id="s1-rv-rating-error" data-t="reviews.error.rating">Choose a rating from 1 to 5 stars.</p>
      </fieldset>
      <div class="field">
        <label class="label" for="s1-rv-title" data-t="reviews.form.headline">Title</label>
        <input class="input" id="s1-rv-title" name="title" maxlength="120">
      </div>
      <div class="field">
        <label class="label" for="s1-rv-body" data-t="reviews.form.body">Your review</label>
        <textarea class="textarea min-h-28" id="s1-rv-body" name="body" aria-invalid="true" aria-describedby="s1-rv-body-error s1-rv-body-hint">Very pretty.</textarea>
        <p class="text-muted-foreground text-sm" id="s1-rv-body-hint" data-t="reviews.form.body_hint">What did you like, or not? At least 20 characters.</p>
        <p class="text-destructive text-sm" id="s1-rv-body-error" data-t="reviews.error.body_short">Write at least 20 characters (12 so far).</p>
      </div>
    </section>
    <footer class="flex flex-wrap justify-end gap-2">
      <button class="btn" data-variant="outline" type="button" data-t="reviews.form.cancel">Cancel</button>
      <button class="btn" type="submit" data-t="reviews.form.submit">Post Review</button>
    </footer>
  </form></div>
</div>
</figure>
<figure class="ab-frame" data-device="state">
<figcaption>No reviews</figcaption>
<div class="ab-screen app">
<div class="p-4 @3xl:p-6"><div class="empty rounded-lg border border-dashed">
  <header><h3 data-t="reviews.empty_title">No reviews yet</h3><p data-t="reviews.empty_text">Bought this? Be the first to say what you think.</p></header>
  <footer class="flex-row"><button class="btn" type="button" data-t="reviews.write">Write a Review</button></footer>
</div></div>
</div>
</figure>
<figure class="ab-frame" data-device="state">
<figcaption>Couldn’t load</figcaption>
<div class="ab-screen app">
<div class="p-4 @3xl:p-6"><div class="alert" data-variant="destructive" role="alert"><h2 data-t="reviews.error.load">Couldn’t load the reviews. Check your connection and try again.</h2><section><div class="mt-2 flex flex-wrap gap-2"><button class="btn" data-variant="outline" data-size="sm" type="button" data-t="reviews.retry">Try Again</button></div></section></div></div>
</div>
</figure>
</div>

</body>
</html>
