<!-- @dsCard group="Other elements" height=820 width=1250 subtitle="Time field, fixed times and free slots" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>TimePicker — preview</title><style>.ab-pop{position:relative;margin-top:4px;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 12px rgb(0 0 0/.08)}</style></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
<figure class="ab-frame" data-device="desktop"><figcaption>Desktop · English · time field, select and slots</figcaption><div class="ab-screen app"><div class="p-6 grid grid-cols-2 gap-8 items-start">
<div class="grid gap-6">
<div class="field"><label class="label" for="d-t">Start time</label><input class="input" id="d-t" type="time" step="300" value="14:30"><p class="text-muted-foreground text-sm">Times are in Japan time (JST).</p></div>
<div class="field"><label class="label" for="d-r">Daily reminder</label><select class="select" id="d-r"><option>No reminder</option><option>7:00 AM</option><option selected>8:00 AM</option><option>9:00 PM</option></select></div>
</div>
<fieldset class="fieldset"><legend class="label">Choose a time</legend><p class="text-muted-foreground text-sm">60 minutes · Wednesday 14 October</p><div class="grid grid-cols-4 gap-2" role="radiogroup"><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="dslot" class="sr-only">10:00</label><label class="btn opacity-50" data-variant="outline" aria-disabled="true"><input type="radio" name="dslot" class="sr-only" disabled><s>11:00</s><span class="sr-only">taken</span></label><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="dslot" class="sr-only">12:00</label><label class="btn opacity-50" data-variant="outline" aria-disabled="true"><input type="radio" name="dslot" class="sr-only" disabled><s>13:30</s><span class="sr-only">taken</span></label><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="dslot" class="sr-only" checked>14:30</label><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="dslot" class="sr-only">15:30</label><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="dslot" class="sr-only">16:30</label><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="dslot" class="sr-only">17:30</label></div></fieldset>
</div></div></figure>
<figure class="ab-frame" data-device="phone" lang="ja"><figcaption>Phone · 日本語 · slots, 3 columns</figcaption><div class="ab-screen app"><div class="p-4 grid gap-5">
<div class="field"><label class="label" for="p-t">開始時刻</label><input class="input" id="p-t" type="time" value="14:30"><p class="text-muted-foreground text-sm">時刻は日本時間（JST）です。</p></div>
<fieldset class="fieldset"><legend class="label">時間を選択</legend><p class="text-muted-foreground text-sm">60分 · 10月14日（水）</p><div class="grid grid-cols-3 gap-2" role="radiogroup"><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="pslot" class="sr-only">10:00</label><label class="btn opacity-50" data-variant="outline" aria-disabled="true"><input type="radio" name="pslot" class="sr-only" disabled><s>11:00</s><span class="sr-only">予約済み</span></label><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="pslot" class="sr-only">12:00</label><label class="btn opacity-50" data-variant="outline" aria-disabled="true"><input type="radio" name="pslot" class="sr-only" disabled><s>13:30</s><span class="sr-only">予約済み</span></label><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="pslot" class="sr-only" checked>14:30</label><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="pslot" class="sr-only">15:30</label><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="pslot" class="sr-only">16:30</label><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="pslot" class="sr-only">17:30</label></div></fieldset>
<button class="btn w-full" type="button">予約する</button></div></div></figure>
<figure class="ab-frame" data-device="state"><figcaption>Loading slots</figcaption><div class="ab-screen app"><div class="p-4 grid gap-3"><p class="label">Choose a time</p><div class="grid grid-cols-3 gap-2"><div class="skeleton h-9 rounded-md bg-muted"></div><div class="skeleton h-9 rounded-md bg-muted"></div><div class="skeleton h-9 rounded-md bg-muted"></div><div class="skeleton h-9 rounded-md bg-muted"></div><div class="skeleton h-9 rounded-md bg-muted"></div><div class="skeleton h-9 rounded-md bg-muted"></div></div></div></div></figure>
<figure class="ab-frame" data-device="state"><figcaption>No free times</figcaption><div class="ab-screen app"><div class="p-4 grid gap-3 justify-items-start"><p class="label">Choose a time</p><p class="text-muted-foreground">No free times on this day.</p><button class="btn" data-variant="outline" type="button">Show the Next Free Day</button></div></div></figure>
<figure class="ab-frame" data-device="state"><figcaption>Slot taken meanwhile (409)</figcaption><div class="ab-screen app"><div class="p-4 grid gap-3"><div class="alert" data-variant="destructive" role="alert"><h2>That time is gone</h2><section>Someone booked 14:30 a moment ago. Choose another time.</section></div><div class="grid grid-cols-4 gap-2" role="radiogroup"><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="sslot" class="sr-only">10:00</label><label class="btn opacity-50" data-variant="outline" aria-disabled="true"><input type="radio" name="sslot" class="sr-only" disabled><s>11:00</s><span class="sr-only">taken</span></label><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="sslot" class="sr-only">12:00</label><label class="btn opacity-50" data-variant="outline" aria-disabled="true"><input type="radio" name="sslot" class="sr-only" disabled><s>13:30</s><span class="sr-only">taken</span></label><label class="btn opacity-50" data-variant="outline" aria-disabled="true"><input type="radio" name="sslot" class="sr-only" disabled><s>14:30</s><span class="sr-only">taken</span></label><label class="btn has-[:checked]:bg-primary has-[:checked]:text-primary-foreground" data-variant="outline"><input type="radio" name="sslot" class="sr-only">15:30</label></div></div></div></figure>
</div>
</body>
</html>
