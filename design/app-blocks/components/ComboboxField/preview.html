<!-- @dsCard group="Other elements" height=710 width=1250 subtitle="Rich select and type-to-filter combobox" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ComboboxField — preview</title><style>.ab-pop{position:relative;margin-top:4px;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 12px rgb(0 0 0/.08)}.ab-sel [role=option]{display:flex;align-items:center;gap:.5rem;padding:.375rem .5rem;border-radius:calc(var(--radius) - 4px);font-size:.875rem}.ab-sel [role=option][aria-selected=true]::after{content:"✓";margin-left:auto}.ab-sel [role=heading]{padding:.375rem .5rem;font-size:.75rem;color:var(--muted-foreground)}.ab-sel hr{margin:.25rem 0;border-color:var(--border)}.ab-sel>button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:.5rem}@container app (width<48rem){.ab-sel [role=option]{min-height:2.75rem}}</style></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
<figure class="ab-frame" data-device="desktop"><figcaption>Desktop · English · rich select open, combobox filtering</figcaption><div class="ab-screen app"><div class="p-6 grid grid-cols-2 gap-8 items-start min-h-[360px]">
<div class="field"><label class="label" for="d-t">Assignee</label><div class="ab-sel grid w-full"><div class="select w-full"><button type="button" class="w-full" id="d-t" aria-haspopup="listbox" aria-expanded="true"><span class="truncate flex items-center gap-2"><span class="avatar" data-size="sm"><span>AT</span></span> Aiko Tanaka</span><svg class="size-4 text-muted-foreground opacity-50 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div><div class="ab-pop p-1 w-full" role="listbox"><div role="group"><div role="heading">Team</div><div role="option" data-value="u1" aria-selected="true"><span class="avatar" data-size="sm"><span>AT</span></span> Aiko Tanaka</div><div role="option" data-value="u2" class="bg-accent text-accent-foreground"><span class="avatar" data-size="sm"><span>KS</span></span> Kenji Sato</div><div role="option" data-value="u3"><span class="avatar" data-size="sm"><span>MW</span></span> Mei Wong</div></div><hr role="separator"><div role="option" data-value="">No one</div></div></div></div>
<div class="field"><label class="label" for="d2-i">Country or region</label><div class="ab-sel grid w-full"><input class="input w-full" type="text" id="d2-i" role="combobox" placeholder="Search countries" value="ja" aria-expanded="true"><div class="ab-pop p-1 w-full" role="listbox"><div role="option" data-value="JP" class="bg-accent text-accent-foreground">Japan · 日本</div><div role="option" data-value="JA">Jamaica · Jamaica</div></div></div></div>
</div></div></figure>
<figure class="ab-frame" data-device="phone" lang="ja"><figcaption>Phone · 日本語 · combobox, 44 px options</figcaption><div class="ab-screen app"><div class="p-4 grid gap-5 min-h-[400px] content-start">
<div class="field"><label class="label" for="p-i">国または地域</label><div class="ab-sel grid w-full"><input class="input w-full" type="text" id="p-i" role="combobox" placeholder="国を検索" value="にほ" aria-expanded="true"><div class="ab-pop p-1 w-full" role="listbox"><div role="option" data-value="JP" class="bg-accent text-accent-foreground">日本 · Japan</div></div></div></div>
<div class="field"><label class="label" for="p2-t">担当者</label><div class="ab-sel grid w-full"><div class="select w-full"><button type="button" class="w-full" id="p2-t" aria-haspopup="listbox" aria-expanded="false"><span class="truncate flex items-center gap-2"><span class="avatar" data-size="sm"><span>AT</span></span> 田中 愛子</span><svg class="size-4 text-muted-foreground opacity-50 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div></div></div>
</div></div></figure>
<figure class="ab-frame" data-device="state"><figcaption>No match</figcaption><div class="ab-screen app"><div class="p-4"><div class="field"><label class="label" for="s1-i">Country or region</label><div class="ab-sel grid w-full"><input class="input w-full" type="text" id="s1-i" role="combobox" placeholder="Search countries" value="Atlantis" aria-expanded="true"><div class="ab-pop p-1 w-full" role="listbox"><p class="px-2 py-6 text-center text-sm text-muted-foreground">No country matches.</p></div></div></div></div></div></figure>
<figure class="ab-frame" data-device="state"><figcaption>Loading (server list)</figcaption><div class="ab-screen app"><div class="p-4"><div class="field"><label class="label" for="s2-i">Labels</label><div class="ab-sel grid w-full"><input class="input w-full" type="text" id="s2-i" role="combobox" placeholder="Search labels" value="" aria-expanded="true"><div class="ab-pop p-1 w-full" role="listbox"><div role="option" aria-disabled="true" class="text-muted-foreground">Loading…</div></div></div></div></div></div></figure>
<figure class="ab-frame" data-device="state"><figcaption>Several values</figcaption><div class="ab-screen app"><div class="p-4"><div class="field"><label class="label" for="s3-i">Labels</label><div class="combobox w-full"><div class="flex flex-wrap items-center gap-1 rounded-md border border-input p-1.5">
<span class="badge" data-variant="secondary">bug <button type="button" aria-label="Remove bug"><svg class="size-3" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span><span class="badge" data-variant="secondary">ui <button type="button" aria-label="Remove ui"><svg class="size-3" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>
<input id="s3-i" class="flex-1 min-w-20 bg-transparent px-1 text-sm outline-none" role="combobox" placeholder="Add a label"></div></div><p class="text-muted-foreground text-sm">Several values: Basecoat draws the chips.</p></div></div></div></figure>
</div>
</body>
</html>
