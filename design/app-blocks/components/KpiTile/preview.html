<!doctype html>
<html>
<head><meta charset="utf-8"><title>KpiTile — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
<figure class="ab-frame" data-device="desktop">
<figcaption>Desktop · English · a row of tiles</figcaption>
<div class="ab-screen app">
<div class="p-4">
<div class="grid grid-cols-3 gap-4"><section class="card" data-size="sm" aria-labelledby="d-revenue-title">
  <header>
    <h2 id="d-revenue-title" class="text-muted-foreground text-sm font-normal" data-t="kpi.revenue.title">Revenue</h2>
  </header>
  <section class="grid gap-2">
    <p class="text-3xl font-semibold tabular-nums">¥420,000</p>
    <p class="flex flex-wrap items-center gap-2 text-sm"><span class="badge" data-variant="secondary">▲ 9 %</span><span class="text-muted-foreground" data-t="kpi.revenue.period">vs last week</span></p>
    <canvas id="d-revenue-spark" class="chart aspect-auto h-10 w-full" role="img" aria-label="Revenue over 8 weeks, rising from ¥310,000 to ¥420,000." data-chart-type="line" data-chart-label-key="w" data-chart-data='[{"w":0,"v":310},{"w":1,"v":342},{"w":2,"v":330},{"w":3,"v":365},{"w":4,"v":391},{"w":5,"v":402},{"w":6,"v":388},{"w":7,"v":420}]' data-chart-series='{"v":{"label":"Revenue","color":"var(--chart-1)","surface":true}}' data-chart-legend="false" data-chart-tooltip="false"></canvas><details><summary class="text-sm">Show as a table</summary><div class="table-container"><table class="table"><thead><tr><th>Week</th><th class="text-right">Revenue</th></tr></thead><tbody><tr><th scope="row">1</th><td class="text-right tabular-nums">¥310,000</td></tr><tr><th scope="row">2</th><td class="text-right tabular-nums">¥342,000</td></tr><tr><th scope="row">3</th><td class="text-right tabular-nums">¥330,000</td></tr><tr><th scope="row">4</th><td class="text-right tabular-nums">¥365,000</td></tr><tr><th scope="row">5</th><td class="text-right tabular-nums">¥391,000</td></tr><tr><th scope="row">6</th><td class="text-right tabular-nums">¥402,000</td></tr><tr><th scope="row">7</th><td class="text-right tabular-nums">¥388,000</td></tr><tr><th scope="row">8</th><td class="text-right tabular-nums">¥420,000</td></tr></tbody></table></div></details>
  </section>
  <footer><a class="text-sm underline-offset-4 hover:underline" href="#" data-t="kpi.revenue.link">View report</a></footer>
</section><section class="card" data-size="sm"><header><h2 class="text-muted-foreground text-sm font-normal">New customers</h2></header><section class="grid gap-2"><p class="text-3xl font-semibold tabular-nums">128</p><p class="flex flex-wrap items-center gap-2 text-sm"><span class="badge" data-variant="secondary">▲ 14 %</span><span class="text-muted-foreground">vs last week</span></p></section></section><section class="card" data-size="sm"><header><h2 class="text-muted-foreground text-sm font-normal">Refunds</h2></header><section class="grid gap-2"><p class="text-3xl font-semibold tabular-nums">6</p><p class="flex flex-wrap items-center gap-2 text-sm"><span class="badge" data-variant="outline">▼ 2</span><span class="text-muted-foreground">vs last week</span></p></section></section></div>
</div>
</div>
</figure>
<figure class="ab-frame" data-device="phone" lang="ja">
<figcaption>Phone · 日本語 · two per row</figcaption>
<div class="ab-screen app">
<div class="p-4">
<div class="grid grid-cols-2 gap-3"><section class="card" data-size="sm" aria-labelledby="p-revenue-title">
  <header>
    <h2 id="p-revenue-title" class="text-muted-foreground text-sm font-normal" data-t="kpi.revenue.title">売上</h2>
  </header>
  <section class="grid gap-2">
    <p class="text-3xl font-semibold tabular-nums">¥420,000</p>
    <p class="flex flex-wrap items-center gap-2 text-sm"><span class="badge" data-variant="secondary">▲ 9%</span><span class="text-muted-foreground" data-t="kpi.revenue.period">先週比</span></p>
    <canvas id="p-revenue-spark" class="chart aspect-auto h-10 w-full" role="img" aria-label="8週間の売上：310,000円から420,000円に増加。" data-chart-type="line" data-chart-label-key="w" data-chart-data='[{"w":0,"v":310},{"w":1,"v":342},{"w":2,"v":330},{"w":3,"v":365},{"w":4,"v":391},{"w":5,"v":402},{"w":6,"v":388},{"w":7,"v":420}]' data-chart-series='{"v":{"label":"売上","color":"var(--chart-1)","surface":true}}' data-chart-legend="false" data-chart-tooltip="false"></canvas><details><summary class="text-sm">表で表示</summary><div class="table-container"><table class="table"><thead><tr><th>週</th><th class="text-right">売上</th></tr></thead><tbody><tr><th scope="row">1</th><td class="text-right tabular-nums">¥310,000</td></tr><tr><th scope="row">2</th><td class="text-right tabular-nums">¥342,000</td></tr><tr><th scope="row">3</th><td class="text-right tabular-nums">¥330,000</td></tr><tr><th scope="row">4</th><td class="text-right tabular-nums">¥365,000</td></tr><tr><th scope="row">5</th><td class="text-right tabular-nums">¥391,000</td></tr><tr><th scope="row">6</th><td class="text-right tabular-nums">¥402,000</td></tr><tr><th scope="row">7</th><td class="text-right tabular-nums">¥388,000</td></tr><tr><th scope="row">8</th><td class="text-right tabular-nums">¥420,000</td></tr></tbody></table></div></details>
  </section>
  <footer><a class="text-sm underline-offset-4 hover:underline" href="#" data-t="kpi.revenue.link">レポートを見る</a></footer>
</section><section class="card" data-size="sm"><header><h2 class="text-muted-foreground text-sm font-normal">新規のお客さま</h2></header><section class="grid gap-2"><p class="text-3xl font-semibold tabular-nums">128</p><p class="flex flex-wrap items-center gap-2 text-sm"><span class="badge" data-variant="secondary">▲ 14%</span><span class="text-muted-foreground">先週比</span></p></section></section></div>
</div>
</div>
</figure>
<figure class="ab-frame" data-device="state">
<figcaption>Loading</figcaption>
<div class="ab-screen app">
<div class="p-4">
<section class="card" data-size="sm" aria-busy="true"><header><div class="skeleton h-4 w-24"></div></header><section class="grid gap-2"><div class="skeleton h-9 w-36"></div><div class="skeleton h-5 w-28"></div></section></section>
</div>
</div>
</figure>
<figure class="ab-frame" data-device="state">
<figcaption>No comparison yet</figcaption>
<div class="ab-screen app">
<div class="p-4">
<section class="card" data-size="sm"><header><h2 class="text-muted-foreground text-sm font-normal">Revenue</h2></header><section class="grid gap-2"><p class="text-3xl font-semibold tabular-nums">¥38,000</p><p class="text-muted-foreground text-sm">First week: a comparison appears next week.</p></section></section>
</div>
</div>
</figure>
<figure class="ab-frame" data-device="state">
<figcaption>Error</figcaption>
<div class="ab-screen app">
<div class="p-4">
<section class="card" data-size="sm"><header><h2 class="text-muted-foreground text-sm font-normal">Revenue</h2></header><section class="grid gap-2"><p class="text-3xl font-semibold text-muted-foreground">—</p><p class="text-sm">Couldn’t load. <button class="btn" data-variant="link" data-size="sm" type="button">Try Again</button></p></section></section>
</div>
</div>
</figure>
</div>
<script src="../lib/chart.umd.min.js"></script>
<script src="../lib/basecoat.all.min.js"></script>
<script src="../lib/basecoat.chart.min.js"></script>
<script>
basecoat.chart(document.getElementById('d-revenue-spark'), {options: {scales: {x: {display: false}, y: {display: false}}, elements: {point: {radius: 0}, line: {borderWidth: 2}}}});
basecoat.chart(document.getElementById('p-revenue-spark'), {options: {scales: {x: {display: false}, y: {display: false}}, elements: {point: {radius: 0}, line: {borderWidth: 2}}}});
</script>
</body>
</html>
