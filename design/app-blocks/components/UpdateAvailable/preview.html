<!-- @dsCard group="App shell" height=720 width=1250 subtitle="A toast that waits for the person" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>UpdateAvailable — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
  <figure class="ab-frame" data-device="desktop">
    <figcaption>Desktop · English · update ready</figcaption>
    <div class="ab-screen app min-h-[320px] transform-gpu">
      <header class="flex items-center border-b px-4 h-14 font-semibold">Class Notes</header>
      <main class="p-6 grid gap-2 text-sm text-muted-foreground"><p>Week 3 · Vocabulary</p><p>Homework</p></main>
      <div class="toaster" data-align="end">
        <div class="toast" role="status" aria-atomic="true" data-category="info" data-duration="-1"><div class="toast-content">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          <section><h2>A new version is ready</h2><p class="break-normal">Reload to use it. Your work is kept.</p></section>
          <footer><button type="button" class="btn" data-toast-action>Reload</button><button type="button" class="btn h-6 text-xs px-2.5 rounded-sm" data-variant="outline" data-toast-cancel>Later</button></footer>
        </div></div>
      </div>
    </div>
  </figure>
  <figure class="ab-frame" data-device="phone" lang="ja">
    <figcaption>Phone · 日本語 · above the bottom bar</figcaption>
    <div class="ab-screen app min-h-[320px] transform-gpu">
      <header class="flex items-center border-b px-4 h-14 font-semibold">クラスノート</header>
      <div class="toaster pb-20">
        <div class="toast" role="status" aria-atomic="true" data-category="info" data-duration="-1"><div class="toast-content">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          <section><h2>新しいバージョンがあります</h2><p class="break-normal">再読み込みすると使えます。作業内容は保持されます。</p></section>
          <footer><button type="button" class="btn" data-toast-action>再読み込み</button><button type="button" class="btn h-6 text-xs px-2.5 rounded-sm" data-variant="outline" data-toast-cancel>あとで</button></footer>
        </div></div>
      </div>
      <nav class="absolute inset-x-0 bottom-0 h-16 border-t bg-background flex items-center justify-around text-xs text-muted-foreground"><span>ノート</span><span>検索</span><span>設定</span></nav>
    </div>
  </figure>
  <figure class="ab-frame" data-device="desktop">
    <figcaption>Breaking change · English · a dialog instead</figcaption>
    <div class="ab-screen app min-h-[280px] transform-gpu">
      <dialog class="alert-dialog" open aria-labelledby="s-t" aria-describedby="s-d">
        <div>
          <header><h2 id="s-t">Update Class Notes to 2.0?</h2><p id="s-d">Your notes are converted to the new format. It takes a few seconds and can’t be undone.</p></header>
          <footer><button class="btn" data-variant="outline" type="button">Later</button><button class="btn" type="button">Update Now</button></footer>
        </div>
      </dialog>
    </div>
  </figure>
</div>
</body>
</html>
