<!-- @dsCard group="Other elements" height=790 width=1250 subtitle="The ? dialog, from one shortcut table" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ShortcutHelp — preview</title><style>.ab-pop{position:relative;margin-top:4px;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 12px rgb(0 0 0/.08)}.ab-dlg{position:static!important;display:block;opacity:1!important;margin:0 auto!important;width:100%}.ab-dlg>*{position:relative!important;top:auto!important;left:auto!important;translate:none!important;scale:none!important;transform:none!important;max-width:100%!important;margin:0 auto}</style></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
<figure class="ab-frame" data-device="desktop"><figcaption>Desktop · English · open with ?</figcaption><div class="ab-screen app"><div class="p-6 bg-black/40 min-h-[480px] grid place-items-center"><dialog class="dialog ab-dlg" open aria-labelledby="t"><div class="sm:max-w-2xl" style="max-width:672px"><header><h2>Keyboard shortcuts</h2><p>Press ? anywhere to see this list.</p></header><section class="grid gap-6 grid-cols-2"><input class="input col-span-full" type="search" placeholder="Filter shortcuts" value=""><section><h3 class="mb-2 text-sm font-medium text-muted-foreground">General</h3><dl class="grid gap-2 text-sm"><div class="flex items-center justify-between gap-4"><dt>Search</dt><dd class="flex items-center gap-1"><kbd class="kbd">⌘</kbd><kbd class="kbd">K</kbd></dd></div><div class="flex items-center justify-between gap-4"><dt>Show shortcuts</dt><dd class="flex items-center gap-1"><kbd class="kbd">?</kbd></dd></div><div class="flex items-center justify-between gap-4"><dt>Go to settings</dt><dd class="flex items-center gap-1"><kbd class="kbd">G</kbd><kbd class="kbd">S</kbd></dd></div></dl></section><section><h3 class="mb-2 text-sm font-medium text-muted-foreground">Notes</h3><dl class="grid gap-2 text-sm"><div class="flex items-center justify-between gap-4"><dt>New note</dt><dd class="flex items-center gap-1"><kbd class="kbd">N</kbd></dd></div><div class="flex items-center justify-between gap-4"><dt>Next / previous</dt><dd class="flex items-center gap-1"><kbd class="kbd">J</kbd><span class="text-muted-foreground">/</span><kbd class="kbd">K</kbd></dd></div><div class="flex items-center justify-between gap-4"><dt>Save</dt><dd class="flex items-center gap-1"><kbd class="kbd">⌘</kbd><kbd class="kbd">S</kbd></dd></div><div class="flex items-center justify-between gap-4"><dt>Delete</dt><dd class="flex items-center gap-1"><kbd class="kbd">⌫</kbd></dd></div></dl></section><section><h3 class="mb-2 text-sm font-medium text-muted-foreground">Text</h3><dl class="grid gap-2 text-sm"><div class="flex items-center justify-between gap-4"><dt>Bold</dt><dd class="flex items-center gap-1"><kbd class="kbd">⌘</kbd><kbd class="kbd">B</kbd></dd></div><div class="flex items-center justify-between gap-4"><dt>Link</dt><dd class="flex items-center gap-1"><kbd class="kbd">⌘</kbd><kbd class="kbd">⇧</kbd><kbd class="kbd">K</kbd></dd></div></dl></section></section><footer><button class="btn" type="button">Close</button></footer><button type="button" class="btn" data-variant="ghost" data-size="icon-sm" aria-label="Close"><svg class="size-3" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></dialog></div></div></figure>
<figure class="ab-frame" data-device="phone" lang="ja"><figcaption>Phone · 日本語 · hardware keyboard, Ctrl</figcaption><div class="ab-screen app"><div class="p-3 bg-black/40 min-h-[480px]"><dialog class="dialog ab-dlg" open aria-labelledby="t"><div class="sm:max-w-2xl" style="max-width:100%"><header><h2>キーボードショートカット</h2><p>どこでも ? を押すとこの一覧を表示します。</p></header><section class="grid gap-6"><input class="input col-span-full" type="search" placeholder="ショートカットを絞り込む" value=""><section><h3 class="mb-2 text-sm font-medium text-muted-foreground">全般</h3><dl class="grid gap-2 text-sm"><div class="flex items-center justify-between gap-4"><dt>検索</dt><dd class="flex items-center gap-1"><kbd class="kbd">Ctrl</kbd><kbd class="kbd">K</kbd></dd></div><div class="flex items-center justify-between gap-4"><dt>ショートカットを表示</dt><dd class="flex items-center gap-1"><kbd class="kbd">?</kbd></dd></div></dl></section><section><h3 class="mb-2 text-sm font-medium text-muted-foreground">ノート</h3><dl class="grid gap-2 text-sm"><div class="flex items-center justify-between gap-4"><dt>新しいノート</dt><dd class="flex items-center gap-1"><kbd class="kbd">N</kbd></dd></div><div class="flex items-center justify-between gap-4"><dt>次へ / 前へ</dt><dd class="flex items-center gap-1"><kbd class="kbd">J</kbd><span class="text-muted-foreground">/</span><kbd class="kbd">K</kbd></dd></div><div class="flex items-center justify-between gap-4"><dt>保存</dt><dd class="flex items-center gap-1"><kbd class="kbd">Ctrl</kbd><kbd class="kbd">S</kbd></dd></div></dl></section></section><footer><button class="btn" type="button">閉じる</button></footer><button type="button" class="btn" data-variant="ghost" data-size="icon-sm" aria-label="閉じる"><svg class="size-3" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></dialog></div></div></figure>
<figure class="ab-frame" data-device="state"><figcaption>Filter: nothing matches</figcaption><div class="ab-screen app"><div class="p-4 grid gap-3"><input class="input" type="search" value="zzz"><p class="text-sm text-muted-foreground">No shortcut matches.</p></div></div></figure>
<figure class="ab-frame" data-device="state"><figcaption>Filter: “save”</figcaption><div class="ab-screen app"><div class="p-4 grid gap-3"><input class="input" type="search" value="save"><section><h3 class="mb-2 text-sm font-medium text-muted-foreground">Notes</h3><dl class="grid gap-2 text-sm"><div class="flex items-center justify-between gap-4"><dt>Save</dt><dd class="flex items-center gap-1"><kbd class="kbd">⌘</kbd><kbd class="kbd">S</kbd></dd></div></dl></section></div></div></figure>
<figure class="ab-frame" data-device="state"><figcaption>Single-key shortcuts off</figcaption><div class="ab-screen app"><div class="p-4 grid gap-3"><label class="label gap-3 font-normal"><input class="input" type="checkbox" role="switch"><span>Use single-key shortcuts</span></label><section><h3 class="mb-2 text-sm font-medium text-muted-foreground">Notes</h3><dl class="grid gap-2 text-sm"><div class="flex items-center justify-between gap-4"><dt>New note</dt><dd class="text-muted-foreground">Off</dd></div><div class="flex items-center justify-between gap-4"><dt>Save</dt><dd class="flex items-center gap-1"><kbd class="kbd">⌘</kbd><kbd class="kbd">S</kbd></dd></div></dl></section></div></div></figure>
</div>
</body>
</html>
