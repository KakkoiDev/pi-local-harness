<!-- @dsCard group="Feedback" height=620 width=1250 subtitle="Info, warning, blocking error" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>InlineAlert — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
  <figure class="ab-frame" data-device="desktop">
    <figcaption>Desktop · English · error above a form, info at the top of a page</figcaption>
    <div class="ab-screen app p-6 grid gap-4">
      <div class="alert" role="status">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <h2>This page is shared with your class</h2>
        <section>Everyone in Class 3B can see and comment on it.</section>
      </div>
      <div class="alert" data-variant="destructive" role="alert">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        <h2>Couldn’t import “notes.csv”</h2>
        <section><p>3 rows have no title. Fix them and import again:</p><ul><li>Row 4</li><li>Row 9</li><li>Row 12</li></ul>
          <div class="mt-2"><button class="btn" data-variant="outline" data-size="sm" type="button">Choose Another File</button></div>
</section>
      </div>
    </div>
  </figure>
  <figure class="ab-frame" data-device="phone" lang="ja">
    <figcaption>Phone · 日本語 · warning</figcaption>
    <div class="ab-screen app p-4 grid gap-4">
      <div class="alert" role="status">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <h2>保存容量がまもなくいっぱいです</h2>
        <section>5 GB 中 4.6 GB を使用しています。アップロードを続けるには古いファイルを削除するか、アップグレードしてください。
          <div class="mt-2"><button class="btn" data-variant="outline" data-size="sm" type="button">ファイルを管理</button></div>
</section>
      </div>
    </div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Success after a page load</figcaption>
    <div class="ab-screen app p-4">
      <div class="alert" role="status">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
        <h2>Password changed</h2>
        <section>Log in with the new one.</section>
      </div>
    </div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Dismissible information</figcaption>
    <div class="ab-screen app p-4">
      <div class="alert relative pe-10" role="status">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <h2>New: notes can have subjects</h2>
        <section>Group your notes by Grammar, Vocabulary or Kanji.</section>
        <button class="btn absolute top-2 end-2" data-variant="ghost" data-size="icon-sm" type="button" aria-label="Dismiss"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
    </div>
  </figure>
</div>
</body>
</html>
