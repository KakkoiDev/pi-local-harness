<!-- @dsCard group="Data" height=1305 width=1250 subtitle="Columns, rows, BOM for Excel, progress" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ExportCsv — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
<figure class="ab-frame" data-device="desktop">
<figcaption>Desktop · English · the dialog</figcaption>
<div class="ab-screen app">
<div class="grid place-items-center bg-muted/40 p-6"><div role="dialog" aria-labelledby="d-export-title" class="card w-full max-w-lg gap-4 shadow-lg">
  <header><h2 id="d-export-title" class="text-lg font-semibold" data-t="export.title">Export orders as CSV</h2></header>
  <section class="grid gap-4"><p class="text-sm text-muted-foreground" data-t="export.lede">A CSV file opens in Excel, Numbers, Google Sheets or any text editor.</p>
      <fieldset class="fieldset grid gap-2">
        <legend class="label" data-t="export.columns">Columns</legend>
        <div class="grid grid-cols-2 gap-2"><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="number" checked><span data-t="export.col.number">Order</span></label><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="date" checked><span data-t="export.col.date">Date</span></label><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="customer" checked><span data-t="export.col.customer">Customer</span></label><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="email"><span data-t="export.col.email">Email</span></label><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="items" checked><span data-t="export.col.items">Items</span></label><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="total" checked><span data-t="export.col.total">Total (yen)</span></label><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="status" checked><span data-t="export.col.status">Status</span></label></div>
        
      </fieldset>
      <fieldset class="fieldset grid gap-2">
        <legend class="label" data-t="export.rows">Rows</legend>
        <label class="label gap-2 font-normal"><input class="input" type="radio" name="rows" value="all"><span data-t="export.rows.all">All orders (1,284)</span></label>
        <label class="label gap-2 font-normal"><input class="input" type="radio" name="rows" value="filtered" checked><span data-t="export.rows.filtered">The 312 that match your filters</span></label>
        <label class="label gap-2 font-normal"><input class="input" type="radio" name="rows" value="selected" disabled><span data-t="export.rows.selected">The 0 you selected</span></label>
      </fieldset>
      <div class="field">
        <label class="label" for="d-export-name" data-t="export.file">File name</label>
        <div class="input-group">
          <input id="d-export-name" name="filename" value="orders-2026-10-18" autocomplete="off" spellcheck="false" class="font-mono">
          <span data-align="inline-end" class="font-mono text-muted-foreground">.csv</span>
        </div>
      </div>
      <label class="label gap-2 font-normal"><input class="input" type="checkbox" name="bom" value="1"><span data-t="export.bom">For Excel (adds a byte-order mark so Japanese shows correctly)</span></label>
      <p class="text-sm text-muted-foreground" data-t="export.format_note">Dates are written 2026-10-18 and money as whole yen, so a spreadsheet can sort and add them.</p></section>
  <footer class="flex flex-wrap justify-end gap-2"><button class="btn" data-variant="outline" type="button" data-t="export.cancel">Cancel</button>
      <button class="btn" type="submit" form="export-form" data-t="export.submit"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>Export CSV</button></footer>
</div></div>
</div>
</figure>
<figure class="ab-frame" data-device="phone" lang="ja">
<figcaption>Phone · 日本語 · BOM on by default</figcaption>
<div class="ab-screen app">
<div class="p-4 @3xl:p-6"><div role="dialog" aria-labelledby="p-export-title" class="card w-full max-w-lg gap-4 shadow-lg">
  <header><h2 id="p-export-title" class="text-lg font-semibold" data-t="export.title">注文をCSVで書き出す</h2></header>
  <section class="grid gap-4"><p class="text-sm text-muted-foreground" data-t="export.lede">CSVファイルはExcel、Numbers、Googleスプレッドシート、テキストエディタで開けます。</p>
      <fieldset class="fieldset grid gap-2">
        <legend class="label" data-t="export.columns">項目</legend>
        <div class="grid grid-cols-2 gap-2"><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="number" checked><span data-t="export.col.number">注文番号</span></label><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="date" checked><span data-t="export.col.date">日付</span></label><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="customer" checked><span data-t="export.col.customer">お客さま</span></label><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="email"><span data-t="export.col.email">メールアドレス</span></label><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="items" checked><span data-t="export.col.items">商品</span></label><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="total" checked><span data-t="export.col.total">合計（円）</span></label><label class="label gap-2 font-normal"><input class="input" type="checkbox" name="columns" value="status" checked><span data-t="export.col.status">状態</span></label></div>
        
      </fieldset>
      <fieldset class="fieldset grid gap-2">
        <legend class="label" data-t="export.rows">行</legend>
        <label class="label gap-2 font-normal"><input class="input" type="radio" name="rows" value="all"><span data-t="export.rows.all">すべての注文（1,284件）</span></label>
        <label class="label gap-2 font-normal"><input class="input" type="radio" name="rows" value="filtered" checked><span data-t="export.rows.filtered">絞り込みに一致する312件</span></label>
        <label class="label gap-2 font-normal"><input class="input" type="radio" name="rows" value="selected" disabled><span data-t="export.rows.selected">選択した0件</span></label>
      </fieldset>
      <div class="field">
        <label class="label" for="p-export-name" data-t="export.file">ファイル名</label>
        <div class="input-group">
          <input id="p-export-name" name="filename" value="orders-2026-10-18" autocomplete="off" spellcheck="false" class="font-mono">
          <span data-align="inline-end" class="font-mono text-muted-foreground">.csv</span>
        </div>
      </div>
      <label class="label gap-2 font-normal"><input class="input" type="checkbox" name="bom" value="1" checked><span data-t="export.bom">Excel用（日本語が正しく表示されるようBOMを付けます）</span></label>
      <p class="text-sm text-muted-foreground" data-t="export.format_note">日付は2026-10-18、金額は円の整数で書き出すので、表計算ソフトで並べ替えや合計ができます。</p></section>
  <footer class="flex flex-wrap justify-end gap-2"><button class="btn" data-variant="outline" type="button" data-t="export.cancel">キャンセル</button>
      <button class="btn" type="submit" form="export-form" data-t="export.submit"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>CSVを書き出す</button></footer>
</div></div>
</div>
</figure>
<figure class="ab-frame" data-device="state">
<figcaption>No column chosen</figcaption>
<div class="ab-screen app">
<div class="p-4 @3xl:p-6"><fieldset class="fieldset grid gap-2" aria-invalid="true" aria-describedby="s1-export-columns-error"><legend class="label">Columns</legend><div class="grid grid-cols-2 gap-2"><label class="label gap-2 font-normal"><input class="input" type="checkbox">Order</label><label class="label gap-2 font-normal"><input class="input" type="checkbox">Date</label><label class="label gap-2 font-normal"><input class="input" type="checkbox">Customer</label><label class="label gap-2 font-normal"><input class="input" type="checkbox">Email</label></div><p class="text-destructive text-sm" id="s1-export-columns-error">Choose at least one column.</p></fieldset></div>
</div>
</figure>
<figure class="ab-frame" data-device="state">
<figcaption>Preparing a large export</figcaption>
<div class="ab-screen app">
<div class="p-4 @3xl:p-6"><div class="grid gap-2">
  <p id="s2-export-progress-label" class="text-sm" data-t="export.preparing">Preparing 2,400 of 12,800 rows…</p>
  <div class="progress" role="progressbar" aria-labelledby="s2-export-progress-label" aria-valuemin="0" aria-valuemax="12800" aria-valuenow="2400"><span style="width: 19%"></span></div>
  <p class="text-sm text-muted-foreground" data-t="export.background">This is a large export. You can close this; it keeps going, and Notifications tells you when it’s ready.</p>
</div><div class="mt-3 flex justify-end"><button class="btn" data-variant="outline" type="button">Stop</button></div></div>
</div>
</figure>
<figure class="ab-frame" data-device="state">
<figcaption>Ready</figcaption>
<div class="ab-screen app">
<div class="p-4 @3xl:p-6"><div class="flex items-start gap-3">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="size-5 text-muted-foreground"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
  <div class="grid gap-0.5"><p class="font-medium" data-t="export.ready">orders-2026-10-18.csv is ready</p><p class="text-sm text-muted-foreground" data-t="export.ready_detail">312 rows · 48 KB</p></div>
</div><div class="mt-3 flex justify-end gap-2"><button class="btn" data-variant="outline" type="button">Done</button><a class="btn" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>Download</a></div></div>
</div>
</figure>
<figure class="ab-frame" data-device="state">
<figcaption>Failed</figcaption>
<div class="ab-screen app">
<div class="p-4 @3xl:p-6"><div class="alert" data-variant="destructive" role="alert"><h2 data-t="export.error.failed">The export stopped at row 6,201. Nothing was saved. Try again; if it keeps failing, export fewer rows.</h2><section><div class="mt-2 flex flex-wrap gap-2"><button class="btn" data-variant="outline" data-size="sm" type="button" data-t="export.retry">Try Again</button></div></section></div></div>
</div>
</figure>
</div>

</body>
</html>
