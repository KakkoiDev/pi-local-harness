<!-- @dsCard group="Collaboration" height=680 width=1250 subtitle="File viewer and diff" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>CodeDiff — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
  <figure class="ab-frame" data-device="desktop">
    <figcaption>Desktop · English · unified diff</figcaption>
    <div class="ab-screen app p-4" style="height:440px">
      <section class="overflow-hidden rounded-lg border">
        <header class="flex flex-wrap items-center gap-2 border-b bg-muted/50 px-3 py-2 text-sm">
          <button class="btn" data-variant="ghost" data-size="icon-sm" type="button" aria-expanded="true" aria-label="Fold file">▾</button>
          <h3 class="font-mono text-sm">app/trips.py</h3>
          <span class="text-xs"><span class="text-success">+6</span> <span class="text-destructive">−2</span></span>
          <div class="button-group ml-auto" role="group" aria-label="View"><button class="btn" data-variant="secondary" data-size="sm" type="button" aria-pressed="true">Unified</button><button class="btn" data-variant="outline" data-size="sm" type="button" aria-pressed="false">Split</button></div>
        </header>
        <div class="scrollbar overflow-x-auto">
          <table class="w-full border-collapse font-mono text-[13px] leading-5">
            <tbody>
              <tr class="bg-muted/60 text-muted-foreground"><td colspan="3" class="px-3 py-1"><button class="btn h-6" data-variant="ghost" data-size="sm" type="button">Show 12 hidden lines</button> @@ def book_trip @@</td></tr>
              <tr><td class="w-12 px-2 text-right text-muted-foreground">14</td><td class="w-12 px-2 text-right text-muted-foreground">14</td><td class="whitespace-pre px-3"> <span class="text-primary font-semibold">    seats</span> = trip.seats</td></tr>
              <tr class="bg-destructive/10"><td class="px-2 text-right text-muted-foreground">15</td><td></td><td class="whitespace-pre px-3"><span class="text-destructive" aria-label="Removed">−</span>    <span class="text-primary font-semibold">if</span> len(people) &gt; seats:</td></tr>
              <tr class="bg-success/10"><td></td><td class="px-2 text-right text-muted-foreground">15</td><td class="whitespace-pre px-3"><span class="text-success" aria-label="Added">+</span>    <span class="text-primary font-semibold">if</span> len(people) + len(staff) &gt; seats:</td></tr>
              <tr><td class="px-2 text-right text-muted-foreground">16</td><td class="px-2 text-right text-muted-foreground">16</td><td class="whitespace-pre px-3">         <span class="text-primary font-semibold">raise</span> TripFull(trip.id)</td></tr>
              <tr class="bg-destructive/10"><td class="px-2 text-right text-muted-foreground">17</td><td></td><td class="whitespace-pre px-3"><span class="text-destructive">−</span>    <span class="text-muted-foreground"># TODO: count teachers</span></td></tr>
              <tr class="bg-success/10"><td></td><td class="px-2 text-right text-muted-foreground">17</td><td class="whitespace-pre px-3"><span class="text-success">+</span>    booking = Booking(trip=trip, people=people, staff=staff)</td></tr>
              <tr class="bg-success/10"><td></td><td class="px-2 text-right text-muted-foreground">18</td><td class="whitespace-pre px-3"><span class="text-success">+</span>    booking.note = <span class="text-chart-3">"Group ticket, school rate"</span></td></tr>
              <tr class="bg-primary/10"><td class="px-2 text-right text-muted-foreground">18</td><td class="px-2 text-right font-semibold">19</td><td class="whitespace-pre px-3">     <span class="text-primary font-semibold">return</span> booking</td></tr>
              <tr class="bg-muted/60 text-muted-foreground"><td colspan="3" class="px-3 py-1"><button class="btn h-6" data-variant="ghost" data-size="sm" type="button">Show 31 hidden lines</button></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </figure>
  <figure class="ab-frame" data-device="phone" lang="ja">
    <figcaption>Phone · 日本語 · unified only, code scrolls sideways</figcaption>
    <div class="ab-screen app p-3" style="height:440px">
      <label class="label mb-2 grid gap-1 text-xs font-normal"><span class="text-muted-foreground">ファイル</span><select class="select w-full"><option>app/trips.py（+6 −2）</option><option>tests/test_trips.py（+14）</option></select></label>
      <section class="overflow-hidden rounded-lg border">
        <header class="flex items-center gap-2 border-b bg-muted/50 px-2 py-1 text-sm"><h3 class="font-mono text-xs">app/trips.py</h3><span class="ml-auto text-xs"><span class="text-success">+6</span> <span class="text-destructive">−2</span></span></header>
        <div class="overflow-x-auto">
          <table class="border-collapse font-mono text-[12px] leading-6">
            <tbody>
              <tr><td class="w-8 px-1 text-right text-muted-foreground">14</td><td class="whitespace-pre px-2">     seats = trip.seats</td></tr>
              <tr class="bg-destructive/10"><td class="px-1 text-right text-muted-foreground">15</td><td class="whitespace-pre px-2"><span class="text-destructive" aria-label="削除">−</span>    if len(people) &gt; seats:</td></tr>
              <tr class="bg-success/10"><td class="px-1 text-right text-muted-foreground">15</td><td class="whitespace-pre px-2"><span class="text-success" aria-label="追加">+</span>    if len(people) + len(staff) &gt; seats:</td></tr>
              <tr class="bg-muted/60 text-muted-foreground"><td colspan="2" class="px-2"><button class="btn" data-variant="ghost" data-size="sm" type="button">非表示の 31 行を表示</button></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Renamed · binary file</figcaption>
    <div class="ab-screen app p-3 grid gap-2 text-sm">
      <p class="flex flex-wrap items-center gap-2 font-mono text-xs"><span class="badge" data-variant="outline">Renamed</span>static/logo.svg → static/brand/logo.svg</p>
      <p class="flex items-center justify-between gap-2 rounded-md border p-2"><span class="text-muted-foreground">This file can’t be shown as text.</span><button class="btn" data-variant="outline" data-size="sm" type="button">Download</button></p>
    </div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Large change, folded</figcaption>
    <div class="ab-screen app p-3 text-sm"><p class="grid gap-2"><span class="font-mono text-xs">data/stations.json</span><button class="btn w-fit" data-variant="outline" data-size="sm" type="button">Large change: 1,204 lines. Show it.</button></p></div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Loading</figcaption>
    <div class="ab-screen app p-3 grid gap-1.5"><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-4 w-2/3"></div><div class="skeleton h-4 w-5/6"></div><div class="skeleton h-4 w-1/2"></div></div>
  </figure>
</div>
</body>
</html>
