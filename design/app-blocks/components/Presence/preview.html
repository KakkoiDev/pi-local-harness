<!doctype html>
<html>
<head><meta charset="utf-8"><title>Presence — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
  <figure class="ab-frame" data-device="desktop"><figcaption>Desktop · English · three people, Ren editing</figcaption><div class="ab-screen app "><header class="flex items-center justify-between gap-2 border-b px-4 py-2"><span class="font-semibold">Week 3 · Vocabulary</span><button class="btn" data-variant="ghost" type="button" aria-expanded="true"><span class="avatar-group"><span class="avatar ring-2 ring-[var(--presence)] " data-size="sm" style="--presence: var(--chart-1)"><span>RS</span></span><span class="avatar ring-2 ring-[var(--presence)] " data-size="sm" style="--presence: var(--chart-3)"><span>MT</span></span><span class="avatar ring-2 ring-[var(--presence)] " data-size="sm" style="--presence: var(--chart-2)"><span>AK</span></span></span></button></header><div class="grid gap-4 @3xl:grid-cols-[1fr_auto]"><article class="grid gap-6 p-6 text-sm leading-relaxed"><p class="pl-3">駅 (eki) station · 電車 (densha) train · 切符 (kippu) ticket</p><p class="relative border-l-2 pl-3" style="border-color: var(--chart-1)"><span class="pointer-events-none absolute -top-5 left-3 rounded border-2 bg-background px-1.5 text-xs" style="border-color: var(--chart-1)" aria-hidden="true">Ren</span>Use から after a place to say where something starts: 東京から (from Tokyo).</p><p class="pl-3">Next week: verbs of movement.</p><p class="text-muted-foreground h-5 text-xs" aria-live="polite">Ren is typing…</p></article><div class="p-4"><div data-popover aria-hidden="false" class="w-64 rounded-md border bg-popover p-3 text-popover-foreground shadow-md" style="position:static"><h3 class="text-sm font-medium">Here now</h3><ul class="mt-2 grid gap-2 text-sm"><li class="flex items-center gap-2"><span class="avatar ring-2 ring-[var(--presence)] " data-size="sm" style="--presence: var(--chart-1)"><span>RS</span></span><span class="flex-1">Ren Sato</span><span class="text-muted-foreground text-xs">Editing</span></li><li class="flex items-center gap-2"><span class="avatar ring-2 ring-[var(--presence)] " data-size="sm" style="--presence: var(--chart-3)"><span>MT</span></span><span class="flex-1">Mina Takahashi</span><span class="text-muted-foreground text-xs">Viewing</span></li><li class="flex items-center gap-2"><span class="avatar ring-2 ring-[var(--presence)] " data-size="sm" style="--presence: var(--chart-2)"><span>AK</span></span><span class="flex-1">Aiko Kato <span class="text-muted-foreground">(you)</span></span><span class="text-muted-foreground text-xs"></span></li></ul><p class="text-muted-foreground mt-3 flex items-center gap-1 text-xs" role="status"><span class="size-2 rounded-full bg-[var(--chart-3)]" aria-hidden="true"></span><span>Live</span></p></div></div></div></div></figure>
  <figure class="ab-frame" data-device="phone" lang="ja"><figcaption>Phone · 日本語 · two avatars and +1, two typing</figcaption><div class="ab-screen app "><header class="flex items-center justify-between gap-2 border-b px-4 py-2"><span class="font-semibold">3 週目・単語</span><button class="btn" data-variant="ghost" type="button" aria-expanded="true"><span class="avatar-group"><span class="avatar ring-2 ring-[var(--presence)] " data-size="sm" style="--presence: var(--chart-1)"><span>RS</span></span><span class="avatar ring-2 ring-[var(--presence)] " data-size="sm" style="--presence: var(--chart-3)"><span>MT</span></span><span data-count class="ring-2 ring-background">+1</span></span></button></header><article class="grid gap-6 p-6 text-sm leading-relaxed"><p class="pl-3">駅（えき）・電車（でんしゃ）・切符（きっぷ）</p><p class="relative border-l-2 pl-3" style="border-color: var(--chart-1)"><span class="pointer-events-none absolute -top-5 left-3 rounded border-2 bg-background px-1.5 text-xs" style="border-color: var(--chart-1)" aria-hidden="true">蓮</span>場所のあとに「から」を付けると出発点を表します。</p><p class="pl-3">来週：移動の動詞</p><p class="text-muted-foreground h-5 text-xs" aria-live="polite">佐藤 さんと 高橋 さんが入力中…</p></article></div></figure>
  <figure class="ab-frame" data-device="state"><figcaption>Alone</figcaption><div class="ab-screen app p-4"><div class="flex items-center gap-3"><span class="avatar-group"><span class="avatar ring-2 ring-[var(--presence)] " data-size="sm" style="--presence: var(--chart-2)"><span>AK</span></span></span><span class="text-muted-foreground text-sm">Only you are here.</span></div></div></figure>
  <figure class="ab-frame" data-device="state"><figcaption>Connecting</figcaption><div class="ab-screen app p-4"><div data-popover aria-hidden="false" class="w-64 rounded-md border bg-popover p-3 text-popover-foreground shadow-md" style="position:static"><h3 class="text-sm font-medium">Here now</h3><ul class="mt-2 grid gap-2 text-sm"><li class="flex items-center gap-2"><span class="avatar ring-2 ring-[var(--presence)] " data-size="sm" style="--presence: var(--chart-2)"><span>AK</span></span><span class="flex-1">Aiko Kato <span class="text-muted-foreground">(you)</span></span><span class="text-muted-foreground text-xs"></span></li></ul><p class="text-muted-foreground mt-3 flex items-center gap-1 text-xs" role="status"><span class="size-2 rounded-full bg-muted-foreground" aria-hidden="true"></span><span>Connecting…</span></p></div></div></figure>
  <figure class="ab-frame" data-device="state"><figcaption>Disconnected / others idle</figcaption><div class="ab-screen app p-4"><div class="alert" role="status"><h2>Offline</h2><section>Your changes are saved and will sync.</section></div><div class="mt-3 flex items-center gap-3"><span class="avatar-group opacity-50"><span class="avatar ring-2 ring-[var(--presence)] " data-size="sm" style="--presence: var(--chart-1)"><span>RS</span></span><span class="avatar ring-2 ring-[var(--presence)] " data-size="sm" style="--presence: var(--chart-3)"><span>MT</span></span></span><span class="text-muted-foreground text-sm">Ren and Mina: away</span></div></div></figure>
</div>
</body>
