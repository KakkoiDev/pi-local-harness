<!-- @dsCard group="App shell" height=884 width=1250 subtitle="Language, what it does, first action" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Onboarding — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
  <figure class="ab-frame" data-device="desktop">
    <figcaption>Desktop · English · step 1, language</figcaption>
    <div class="ab-screen app">
      <main class="grid min-h-[460px] place-items-center bg-muted/40 p-4">
        <section class="card w-full max-w-md">
          <header class="gap-3">
            <p class="text-muted-foreground text-xs">Step 1 of 3</p>
            <h1 class="text-xl font-semibold">Welcome to Class Notes</h1>
            <p class="text-muted-foreground text-sm">Choose your language. You can change it later in Settings.</p>
          </header>
          <section>
            <fieldset class="grid gap-2">
              <label class="label gap-3 rounded-md border p-3 font-normal has-[:checked]:border-primary"><input class="input" type="radio" name="d-lang" checked><span lang="en">English</span></label>
              <label class="label gap-3 rounded-md border p-3 font-normal has-[:checked]:border-primary"><input class="input" type="radio" name="d-lang"><span lang="ja">日本語</span></label>
            </fieldset>
          </section>
          <footer class="flex items-center justify-between gap-2">
            <button class="btn" data-variant="ghost" type="button">Skip</button>
            <div class="flex items-center gap-3">
              <ol class="flex gap-1.5" aria-hidden="true"><li class="size-2 rounded-full bg-primary"></li><li class="size-2 rounded-full bg-muted-foreground/30"></li><li class="size-2 rounded-full bg-muted-foreground/30"></li></ol>
              <button class="btn" type="button">Next</button>
            </div>
          </footer>
        </section>
      </main>
    </div>
  </figure>
  <figure class="ab-frame" data-device="phone" lang="ja">
    <figcaption>Phone · 日本語 · step 2</figcaption>
    <div class="ab-screen app">
      <main class="grid min-h-[460px] place-items-center bg-muted/40 p-4">
        <section class="card w-full max-w-md">
          <header class="gap-3">
            <p class="text-muted-foreground text-xs">ステップ 2/3</p>
            <h1 class="text-xl font-semibold">できること</h1>
          </header>
          <section>
            <ul class="grid gap-3 text-sm">
              <li class="flex gap-3"><span class="bg-muted grid size-8 shrink-0 place-items-center rounded-md" aria-hidden="true">✎</span><span>英語と日本語でノートを書けます。ふりがなも付けられます。</span></li>
              <li class="flex gap-3"><span class="bg-muted grid size-8 shrink-0 place-items-center rounded-md" aria-hidden="true">#</span><span>文法・単語・漢字など、科目ごとにまとめられます。</span></li>
              <li class="flex gap-3"><span class="bg-muted grid size-8 shrink-0 place-items-center rounded-md" aria-hidden="true">↻</span><span>このデバイスに保存され、オフラインでも使えます。</span></li>
            </ul>
          </section>
          <footer class="flex items-center justify-between gap-2">
            <button class="btn" data-variant="ghost" type="button">戻る</button>
            <div class="flex items-center gap-3">
              <ol class="flex gap-1.5" aria-hidden="true"><li class="size-2 rounded-full bg-muted-foreground/30"></li><li class="size-2 rounded-full bg-primary"></li><li class="size-2 rounded-full bg-muted-foreground/30"></li></ol>
              <button class="btn" type="button">次へ</button>
            </div>
          </footer>
        </section>
      </main>
    </div>
  </figure>
  <figure class="ab-frame" data-device="desktop">
    <figcaption>Step 3 · English · the first action</figcaption>
    <div class="ab-screen app">
      <main class="grid min-h-[300px] place-items-center bg-muted/40 p-4">
        <section class="card w-full max-w-md">
          <header class="gap-3">
            <p class="text-muted-foreground text-xs">Step 3 of 3</p>
            <h1 class="text-xl font-semibold">Start with one note</h1>
            <p class="text-muted-foreground text-sm">A title is enough. You can add the rest later.</p>
          </header>
          <footer class="flex items-center justify-between gap-2">
            <button class="btn" data-variant="ghost" type="button">Back</button>
            <div class="flex items-center gap-3">
              <ol class="flex gap-1.5" aria-hidden="true"><li class="size-2 rounded-full bg-muted-foreground/30"></li><li class="size-2 rounded-full bg-muted-foreground/30"></li><li class="size-2 rounded-full bg-primary"></li></ol>
              <a class="btn" href="#">Write Your First Note</a>
            </div>
          </footer>
        </section>
      </main>
    </div>
  </figure>
</div>
</body>
</html>
