<!doctype html>
<html>
<head><meta charset="utf-8"><title>WipLimit — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
<figure class="ab-frame" data-device="desktop"><figcaption>Desktop · English · Doing over its limit</figcaption><div class="ab-screen app"><div class="grid gap-4 p-6"><h1 class="text-xl font-semibold">Class project</h1><div class="grid grid-cols-3 gap-4">
<section class="grid content-start gap-3 rounded-lg bg-muted/50 p-3 "><header class="flex items-center justify-between gap-2"><h2 class="flex items-center gap-2 text-sm font-semibold"><span>To Do</span><span class="badge" data-variant="secondary">2</span></h2><button class="btn" data-variant="ghost" data-size="icon-sm" type="button" aria-label="Limit for To Do">⋯</button></header><article class="card gap-2 p-3"><h3 class="text-sm font-medium">Interview three classmates</h3><span class="badge w-fit" data-variant="outline">Research</span></article><article class="card gap-2 p-3"><h3 class="text-sm font-medium">Draft the survey</h3><span class="badge w-fit" data-variant="outline">Writing</span></article></section>
<section class="grid content-start gap-3 rounded-lg bg-muted/50 p-3 ring-2 ring-warning"><header class="flex items-center justify-between gap-2"><h2 class="flex items-center gap-2 text-sm font-semibold"><span>Doing</span><span class="badge bg-warning text-warning-foreground">5 / 4</span></h2><button class="btn" data-variant="ghost" data-size="icon-sm" type="button" aria-label="Limit for Doing">⋯</button></header><p class="rounded-md bg-warning/20 px-2 py-1 text-xs" role="status">1 over the limit. Finish a card before starting another.</p><article class="card gap-2 p-3"><h3 class="text-sm font-medium">Poster layout</h3><span class="badge w-fit" data-variant="outline">Design</span></article><article class="card gap-2 p-3"><h3 class="text-sm font-medium">Translate the settings page</h3><span class="badge w-fit" data-variant="outline">Writing</span></article><article class="card gap-2 p-3"><h3 class="text-sm font-medium">Fix the timetable</h3><span class="badge w-fit" data-variant="outline">Code</span></article><article class="card gap-2 p-3"><h3 class="text-sm font-medium">Book the library room</h3><span class="badge w-fit" data-variant="outline">Admin</span></article><article class="card gap-2 p-3"><h3 class="text-sm font-medium">Print flyers</h3><span class="badge w-fit" data-variant="outline">Design</span></article></section>
<section class="grid content-start gap-3 rounded-lg bg-muted/50 p-3 "><header class="flex items-center justify-between gap-2"><h2 class="flex items-center gap-2 text-sm font-semibold"><span>Done</span><span class="badge" data-variant="secondary">3</span></h2><button class="btn" data-variant="ghost" data-size="icon-sm" type="button" aria-label="Limit for Done">⋯</button></header><article class="card gap-2 p-3"><h3 class="text-sm font-medium">Pick the topic</h3><span class="badge w-fit" data-variant="outline">Research</span></article></section></div></div></div></figure>
<figure class="ab-frame" data-device="phone" lang="ja"><figcaption>Phone · 日本語 · over the limit</figcaption><div class="ab-screen app"><div class="grid gap-3 p-4"><h1 class="text-xl font-semibold">クラスのプロジェクト</h1>
<section class="grid content-start gap-3 rounded-lg bg-muted/50 p-3 ring-2 ring-warning"><header class="flex items-center justify-between gap-2"><h2 class="flex items-center gap-2 text-sm font-semibold"><span>進行中</span><span class="badge bg-warning text-warning-foreground">5 / 4</span></h2><button class="btn" data-variant="ghost" data-size="icon-sm" type="button" aria-label="Limit for 進行中">⋯</button></header><p class="rounded-md bg-warning/20 px-2 py-1 text-xs" role="status">上限を1枚超えています。新しく始める前にカードを1枚完了させましょう。</p><article class="card gap-2 p-3"><h3 class="text-sm font-medium">ポスターのレイアウト</h3><span class="badge w-fit" data-variant="outline">デザイン</span></article><article class="card gap-2 p-3"><h3 class="text-sm font-medium">設定ページの翻訳</h3><span class="badge w-fit" data-variant="outline">執筆</span></article><article class="card gap-2 p-3"><h3 class="text-sm font-medium">時間割の修正</h3><span class="badge w-fit" data-variant="outline">コード</span></article></section></div></div></figure>
<figure class="ab-frame" data-device="state"><figcaption>At the limit</figcaption><div class="ab-screen app"><div class="p-4"><section class="grid content-start gap-3 rounded-lg bg-muted/50 p-3 "><header class="flex items-center justify-between gap-2"><h2 class="flex items-center gap-2 text-sm font-semibold"><span>Doing</span><span class="badge" data-variant="outline">4 / 4</span></h2><button class="btn" data-variant="ghost" data-size="icon-sm" type="button" aria-label="Limit for Doing">⋯</button></header><article class="card gap-2 p-3"><h3 class="text-sm font-medium">Poster layout</h3><span class="badge w-fit" data-variant="outline">Design</span></article></section></div></div></figure>
<figure class="ab-frame" data-device="state"><figcaption>Setting the limit</figcaption><div class="ab-screen app"><div class="p-4"><div class="grid w-64 gap-3 rounded-md border bg-popover p-4 shadow-md"><div class="field"><label class="label" for="wl-l">Work-in-progress limit</label><input class="input" id="wl-l" type="number" value="4"><p class="text-sm text-muted-foreground">Most cards this column should hold at once. Empty for no limit.</p></div><div class="flex justify-between gap-2"><button class="btn" data-variant="ghost" data-size="sm" type="button">Remove Limit</button><button class="btn" data-size="sm" type="button">Save</button></div></div></div></div></figure>
<figure class="ab-frame" data-device="state"><figcaption>Invalid limit</figcaption><div class="ab-screen app"><div class="p-4"><div class="grid w-64 gap-3 rounded-md border bg-popover p-4 shadow-md"><div class="field"><label class="label" for="wl-b">Work-in-progress limit</label><input class="input" id="wl-b" type="number" value="0" aria-invalid="true" aria-describedby="wl-b-e"><p id="wl-b-e" class="text-destructive text-sm">Use a number from 1 to 99, or leave it empty.</p></div><div class="flex justify-between gap-2"><button class="btn" data-variant="ghost" data-size="sm" type="button">Remove Limit</button><button class="btn" data-size="sm" type="button">Save</button></div></div></div></div></figure>
</div>
</body>
</html>
