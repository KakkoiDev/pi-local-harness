<!doctype html>
<html>
<head><meta charset="utf-8"><title>Channels — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
  <figure class="ab-frame" data-device="desktop">
    <figcaption>Desktop · English · a channel with new messages</figcaption>
    <div class="ab-screen app flex" style="height:580px">
      <nav class="w-56 shrink-0 border-r bg-sidebar text-sm" aria-label="Channels and messages">
        <p class="border-b px-3 py-3 font-semibold">Class 3-B</p>
        <h3 class="text-muted-foreground px-3 pt-3 text-xs font-medium">Channels</h3>
        <ul class="grid gap-0.5 p-2">
          <li><a href="#" aria-current="page" class="flex items-center gap-2 rounded-md bg-accent px-2 py-1.5 font-medium"># field-trip</a></li>
          <li><a href="#" class="flex items-center gap-2 rounded-md px-2 py-1.5 font-semibold"># homework <span class="badge ml-auto" aria-label="5 unread">5</span></a></li>
          <li><a href="#" class="text-muted-foreground flex items-center gap-2 rounded-md px-2 py-1.5"># random</a></li>
        </ul>
        <h3 class="text-muted-foreground px-3 text-xs font-medium">Direct messages</h3>
        <ul class="grid gap-0.5 p-2">
          <li><a href="#" class="flex items-center gap-2 rounded-md px-2 py-1.5"><span class="avatar" data-size="sm"><span class="bg-muted">KA</span><span class="avatar-badge bg-green-600 ring-sidebar"></span></span>Kana Abe</a></li>
          <li><a href="#" class="flex items-center gap-2 rounded-md px-2 py-1.5 font-semibold"><span class="avatar" data-size="sm"><span class="bg-muted">KM</span></span>Kaito Mori <span class="badge ml-auto">1</span></a></li>
        </ul>
      </nav>
      <main class="flex min-w-0 flex-1 flex-col">
        <header class="flex items-center gap-2 border-b px-4 py-2"><h1 class="font-semibold"># field-trip</h1><p class="text-muted-foreground truncate text-sm">Plans for Friday’s museum visit</p><span class="text-muted-foreground ml-auto text-sm">28 members</span></header>
        <ol class="grid flex-1 content-start gap-3 overflow-y-auto px-4 py-3 text-sm">
          <li role="separator" class="text-muted-foreground flex items-center gap-2 text-xs"><hr class="flex-1"><span>Yesterday</span><hr class="flex-1"></li>
          <li class="grid grid-cols-[auto_1fr] gap-x-3"><span class="avatar"><span class="bg-muted">KM</span></span><div><p><b>Kaito Mori</b> <span class="text-muted-foreground text-xs">16:40</span></p><p>Permission slips are due Wednesday.</p></div></li>
          <li role="separator" class="text-muted-foreground flex items-center gap-2 text-xs"><hr class="flex-1"><span>Today</span><hr class="flex-1"></li>
          <li class="grid grid-cols-[auto_1fr] gap-x-3"><span class="avatar"><span class="bg-muted">RS</span></span><div><p><b>Ren Sato</b> <span class="text-muted-foreground text-xs">10:04</span></p><p>The museum confirmed our booking.</p><p class="mt-1 text-xs font-medium text-primary">4 replies · Last reply 10:32</p></div></li>
          <li role="separator" class="flex items-center gap-2 text-xs text-destructive"><hr class="flex-1 border-destructive"><span>New</span></li>
          <li class="grid grid-cols-[auto_1fr] gap-x-3"><span class="avatar"><span class="bg-muted">KA</span></span><div><p><b>Kana Abe</b> <span class="text-muted-foreground text-xs">10:41</span></p><p>Can <a class="badge" data-variant="secondary" href="#">@Ren Sato</a> bring the map?</p></div></li>
        </ol>
        <p class="text-muted-foreground h-5 px-4 text-xs">Kana Abe is typing…</p>
        <form class="flex items-end gap-2 border-t p-3"><button class="btn" data-variant="ghost" data-size="icon" type="button" aria-label="Attach a file">＋</button><textarea class="textarea min-h-10 flex-1" rows="1" placeholder="Message #field-trip" aria-label="Message #field-trip"></textarea><button class="btn" type="button">Send</button></form>
      </main>
    </div>
  </figure>
  <figure class="ab-frame" data-device="phone" lang="ja">
    <figcaption>Phone · 日本語 · the channel list is home</figcaption>
    <div class="ab-screen app flex flex-col" style="height:580px">
      <header class="border-b px-4 py-3 font-semibold">3年B組</header>
      <nav class="flex-1 overflow-y-auto text-base" aria-label="チャンネルとメッセージ">
        <h3 class="text-muted-foreground px-4 pt-3 text-xs font-medium">チャンネル</h3>
        <ul class="grid p-2">
          <li><a href="#" class="flex min-h-11 items-center gap-2 rounded-md px-2"># 遠足</a></li>
          <li><a href="#" class="flex min-h-11 items-center gap-2 rounded-md px-2 font-semibold"># 宿題 <span class="badge ml-auto" aria-label="未読 5 件">5</span></a></li>
          <li><a href="#" class="text-muted-foreground flex min-h-11 items-center gap-2 rounded-md px-2"># 雑談</a></li>
        </ul>
        <h3 class="text-muted-foreground px-4 text-xs font-medium">ダイレクトメッセージ</h3>
        <ul class="grid p-2">
          <li><a href="#" class="flex min-h-11 items-center gap-3 rounded-md px-2"><span class="avatar"><span class="bg-muted">阿</span><span class="avatar-badge bg-green-600 ring-background"></span></span>阿部 かな</a></li>
          <li><a href="#" class="flex min-h-11 items-center gap-3 rounded-md px-2 font-semibold"><span class="avatar"><span class="bg-muted">森</span></span>森 海斗 <span class="badge ml-auto">1</span></a></li>
        </ul>
      </nav>
    </div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Empty channel</figcaption>
    <div class="ab-screen app p-4 text-sm grid gap-1"><p class="font-semibold">This is the start of #art-club.</p><p class="text-muted-foreground">Say hello, or share what this channel is for.</p></div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Disconnected</figcaption>
    <div class="ab-screen app"><p class="bg-muted px-4 py-2 text-sm">You’re offline. Messages will send when you’re back.</p></div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Not a member</figcaption>
    <div class="ab-screen app p-3 flex items-center justify-between gap-2 text-sm"><span>You’re reading #staff-room. Join to send messages.</span><button class="btn" data-size="sm" type="button">Join Channel</button></div>
  </figure>
</div>
</body>
</html>
