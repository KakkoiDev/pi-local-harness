<!doctype html>

<head><meta charset="utf-8"><title>ArtSprites — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=DotGothic16&display=swap"><style>canvas{image-rendering:pixelated}</style></head>

<div class="ab-stage">
<figure class="ab-frame" data-device="wide"><figcaption>Sizes · 16 at 1×, 2×, 4× (whole numbers only) · 32 redrawn, not doubled</figcaption><div class="ab-screen app " style=""><div class="flex flex-wrap items-end gap-8 p-6"><div class="grid gap-1 text-xs"><canvas id="sz1" style="width:16px;height:16px"></canvas>16 · 1×</div><div class="grid gap-1 text-xs"><canvas id="sz2" style="width:32px;height:32px"></canvas>2×</div><div class="grid gap-1 text-xs"><canvas id="sz4" style="width:64px;height:64px"></canvas>4× (the game kit scale)</div><div class="grid gap-1 text-xs"><canvas id="grid8" style="width:128px;height:128px"></canvas>8× with the pixel grid</div><div class="grid gap-1 text-xs"><canvas id="bad" style="width:128px;height:128px;outline:2px dashed var(--destructive);outline-offset:4px"></canvas><span class="text-destructive">Wrong: a 16 doubled to “32”</span></div></div></div></figure><figure class="ab-frame" data-device="desktop"><figcaption>Outline · full (16 px default) and selective (32 px and up)</figcaption><div class="ab-screen app " style=""><div class="flex flex-wrap gap-8 p-6 items-end"><div class="grid gap-1 text-xs"><canvas id="ofull" style="width:128px;height:128px"></canvas>full</div><div class="grid gap-1 text-xs"><canvas id="osel" style="width:128px;height:128px"></canvas>selective: top and left take the shade</div><div class="grid gap-1 text-xs"><canvas id="shade3" style="width:128px;height:128px"></canvas>3-step ramp, light top-left</div><div class="grid gap-1 text-xs"><canvas id="pillow" style="width:128px;height:128px;outline:2px dashed var(--destructive);outline-offset:4px"></canvas><span class="text-destructive">Wrong: pillow shading</span></div></div></div></figure><figure class="ab-frame" data-device="phone" lang="ja"><figcaption>Animation · 日本語</figcaption><div class="ab-screen app " style=""><div class="grid gap-3 p-4 text-sm"><div><b>待機 idle</b> · 2 コマ · 500 ms<div class="flex gap-2 mt-1"><canvas id="idle0" style="width:64px;height:64px"></canvas><canvas id="idle1" style="width:64px;height:64px"></canvas></div></div><div><b>歩き walk</b> · 4 コマ · 120 ms<div class="flex gap-2 mt-1"><canvas id="walk0" style="width:64px;height:64px"></canvas><canvas id="walk1" style="width:64px;height:64px"></canvas><canvas id="walk2" style="width:64px;height:64px"></canvas><canvas id="walk3" style="width:64px;height:64px"></canvas></div></div><div><b>攻撃 attack</b> · 80 · 60 · 140 ms<div class="flex gap-2 mt-1"><canvas id="atk0" style="width:64px;height:64px"></canvas><canvas id="atk1" style="width:64px;height:64px"></canvas><canvas id="atk2" style="width:64px;height:64px"></canvas></div></div><div><b>ダメージ hurt</b> · 80 · 160 ms<div class="flex gap-2 mt-1"><canvas id="hurt0" style="width:64px;height:64px"></canvas><canvas id="hurt1" style="width:64px;height:64px"></canvas></div></div><div class="flex items-center gap-3"><canvas id="live" style="width:96px;height:96px"></canvas><span class="text-muted-foreground">再生中: 歩き（動きを減らす設定では止まります）</span></div></div></div></figure><figure class="ab-frame" data-device="wide"><figcaption>Named parts and variants · one body, swapped keys (skin, hair, outfit) and a monster from parts</figcaption><div class="ab-screen app " style=""><div class="flex flex-wrap gap-6 p-6 items-end"><div class="grid gap-1 text-xs"><canvas id="var0" style="width:64px;height:64px"></canvas>outfit r/R</div><div class="grid gap-1 text-xs"><canvas id="var1" style="width:64px;height:64px"></canvas>outfit b/B</div><div class="grid gap-1 text-xs"><canvas id="var2" style="width:64px;height:64px"></canvas>outfit g/G</div><div class="grid gap-1 text-xs"><canvas id="var3" style="width:64px;height:64px"></canvas>outfit y/o · hair y</div><div class="grid gap-1 text-xs"><canvas id="var4" style="width:64px;height:64px"></canvas>skin n · hair k</div><div class="grid gap-1 text-xs"><canvas id="var5" style="width:64px;height:64px"></canvas>hood (Dusk)</div><div class="grid gap-1 text-xs"><canvas id="mon0" style="width:64px;height:64px"></canvas>blob · dots</div><div class="grid gap-1 text-xs"><canvas id="mon1" style="width:64px;height:64px"></canvas>blob · rose (Dusk)</div><div class="grid gap-1 text-xs"><canvas id="mon2" style="width:64px;height:64px"></canvas>blob · crown</div></div></div></figure>
</div>
<script>
const PAL={"meadow": {"k": "#1b1c2b", "p": "#2b2d42", "q": "#4a4e69", "d": "#9aa0b8", "w": "#f4efe1", "y": "#f2b33d", "o": "#c27c2c", "r": "#e05a47", "R": "#9e3a3a", "g": "#5bb85d", "G": "#3a7d44", "l": "#a7d86d", "b": "#4aa3df", "B": "#2f6a9e", "s": "#f0b48a", "n": "#7a5236", "Q": "#9aa0b8"}, "dusk": {"k": "#0f0e17", "p": "#241e3a", "q": "#3d3363", "Q": "#6c5f9e", "d": "#a99ad6", "w": "#f5ecff", "y": "#ffb86b", "o": "#c9743e", "r": "#ff5c7a", "R": "#a3324f", "g": "#5ee6b0", "G": "#2f9e7d", "b": "#59c3ff", "B": "#2f6fb8", "s": "#e8b4a0", "n": "#6b4a3a", "l": "#f5ecff"}, "arcade": {"k": "#0b0b12", "p": "#1f2a5c", "q": "#5a5560", "d": "#c5c7cf", "w": "#fbf5ea", "y": "#ffae1a", "r": "#ff3b5c", "R": "#7a2a6b", "g": "#2ee66b", "G": "#0f8a5f", "b": "#3aa8ff", "n": "#a8552f", "s": "#a8552f", "B": "#1f2a5c", "l": "#2ee66b", "o": "#a8552f", "Q": "#c5c7cf"}, "ink": {"k": "#111111", "q": "#3d3d3d", "d": "#aaaaaa", "w": "#f2f2ec", "p": "#3d3d3d", "r": "#aaaaaa", "R": "#3d3d3d", "g": "#aaaaaa", "G": "#3d3d3d", "l": "#f2f2ec", "y": "#f2f2ec", "o": "#aaaaaa", "b": "#aaaaaa", "B": "#3d3d3d", "s": "#f2f2ec", "n": "#3d3d3d", "Q": "#aaaaaa"}}, SPR={"hero": ["................", ".....kkkkkk.....", "....knnnnnnk....", "...knnnnnnnnk...", "...knnsssssnk...", "...knskssksnk...", "....ksssssssk...", ".....ksssssk....", "....kkrrrrrkk...", "...ksrrryrrRsk..", "...ksrRyyyRRsk..", "...kkrrrrrRRkk..", "....kBBBkBBBk...", "....kBBBkBBBk...", "....knnnknnnk...", "....kkkk.kkkk..."], "slime": ["................", "................", "................", "................", "......kkkk......", "....kkggggkk....", "...kgllggggGk...", "..kglggggggGGk..", "..kgggwkggwkGk..", ".kggggkkggkkgGk.", ".kgggggggggggGk.", ".kggggggggggGGk.", ".kGgggggggggGGk.", "..kGGGGGGGGGGk..", "...kkkkkkkkkk...", "................"], "potion": ["................", "......kkkk......", "......knnk......", "......kkkk......", ".......kwk......", ".......kwk......", "......kwwwk.....", ".....kwwwwwk....", "....kwrrrrrwk...", "....krwrrrrRk...", "....krrrrrrRk...", "....krrrrrRRk...", ".....kRRRRRk....", "......kkkkk.....", "................", "................"], "grass": ["gggggggggggggggg", "gglggggggggGgggg", "gglGgggggggGlggg", "ggggggggggggggGg", "ggggGggggggggggg", "gggGlgggglgggggg", "gggggggggGlggggg", "gggggggggggggggg", "gGgggggggggggglg", "glggggggggggggGg", "gggggggGgggggggg", "ggggggglgggggggg", "gggggggggggGgggg", "gggglgggggglGggg", "ggggGggggggggggg", "gggggggggggggggg"], "heart": ["................", "................", "...kkk....kkk...", "..krrrk..krrrk..", ".krwwrrkkrrrrRk.", ".krwrrrrrrrrrRk.", ".krrrrrrrrrrrRk.", ".krrrrrrrrrrRRk.", "..krrrrrrrrRRk..", "...krrrrrrRRk...", "....krrrrRRk....", ".....krrRRk.....", "......krRk......", ".......kk.......", "................", "................"], "coin": ["................", "................", ".....kkkkkk.....", "....kyyyyyyk....", "...kywwyyyyok...", "...kywyyooyok...", "...kyyyoyyyok...", "...kyyyoyyyok...", "...kyyyoyyyok...", "...kyyyooyyok...", "...kyyyyyyook...", "....kooooook....", ".....kkkkkk.....", "................", "................", "................"], "ship": [".......kk.......", "......kwwk......", "......kbbk......", ".....kbwwbk.....", ".....kbwwbk.....", "....kbbbbbbk....", "...kBbbbbbbBk...", "..kBbbbyybbbBk..", ".kBbbbbyybbbbBk.", ".kBBkbbbbbbkBBk.", ".kkk.kbbbbk.kkk.", ".....kBBBBk.....", "......kyyk......", "......kryk......", ".......kk.......", "................"], "button9": ["..kkkkkkkk..", ".kwwwwwwwwk.", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kooooooooook", ".kooooooook.", "..kkkkkkkk.."], "frame9": [".kkkkkkkkkk.", "kwwwwwwwwwwk", "kwqqqqqqqqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqqqqqqqqdk", "kddddddddddk", ".kkkkkkkkkk."]};
function grid(name,pal,swap){const p=Object.assign({},PAL[pal||'meadow'],swap||{});return SPR[name].map(r=>[...r].map(c=>c==='.'?null:p[c]||c))}
function blit(ctx,g,x,y,s,flip){s=s||1;for(let j=0;j<g.length;j++)for(let i=0;i<g[j].length;i++){const c=g[j][flip?g[j].length-1-i:i];if(c){ctx.fillStyle=c;ctx.fillRect(x+i*s,y+j*s,s,s)}}}
function sprite(ctx,name,x,y,s,pal,swap,flip){blit(ctx,grid(name,pal,swap),x,y,s,flip)}
function canvasOf(id,w,h){const c=document.getElementById(id);c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return x}
function rect(ctx,c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}


const H = SPR.hero;
const hero = (legs, dy, extra) => { const g = H.map(r=>r); if (legs) for (let i=0;i<4;i++) g[12+i]=legs[i]; let out = g; if (dy) out = ['................'].concat(g.slice(0,11)).concat(g.slice(12)); return out; };
const W1 = ['....kBBBkBBBk...','...kBBBk.kBBk...','...knnnk.knnk...','...kkkk..kkk....'];
const W3 = ['....kBBBkBBBk...','....kBBk.kBBBk..','....knnk.knnnk..','....kkk..kkkk...'];
function drawG(id, g, pal, swap, s, bg) { const x = canvasOf(id, g[0].length*(s||1), g.length*(s||1)); if (bg) rect(x,bg,0,0,999,999); const P=Object.assign({},PAL[pal||'meadow'],swap||{}); blit(x, g.map(r=>[...r].map(c=>c==='.'?null:P[c]||c)), 0, 0, s||1); return x; }
drawG('sz1', H); drawG('sz2', H); drawG('sz4', H);
{ const x = drawG('grid8', H, 'meadow', {}, 8); x.strokeStyle='rgba(127,127,127,.35)'; x.lineWidth=1; for (let i=0;i<=16;i++){ x.beginPath(); x.moveTo(i*8+.5,0); x.lineTo(i*8+.5,128); x.stroke(); x.beginPath(); x.moveTo(0,i*8+.5); x.lineTo(128,i*8+.5); x.stroke(); } }
{ const g2 = []; H.forEach(r=>{ const d=[...r].map(c=>c+c).join(''); g2.push(d,d); }); drawG('bad', g2, 'meadow', {}, 4); }
// outlines
drawG('ofull', SPR.slime, 'meadow', {}, 8);
{ const S = SPR.slime.map(r=>[...r]); const shade = {g:'G',l:'g',G:'G',w:'d'}; const out = S.map((r,j)=>r.map((c,i)=>{ if(c!=='k') return c; const right=r[i+1], below=(S[j+1]||[])[i], left=r[i-1], above=(S[j-1]||[])[i]; const inner=[right,below].find(n=>n&&n!=='.'&&n!=='k'); if (inner && (left==='.'||above==='.'||left===undefined||above===undefined)) return shade[inner]||c; return c; }).join('')); drawG('osel', out, 'meadow', {}, 8); }
// shading ramps on a 32 px ball
function ball(id, pillow) { const x = canvasOf(id, 32, 32); const P = PAL.meadow; for (let j=0;j<32;j++) for (let i=0;i<32;i++) { const dx=i-15.5, dy=j-15.5, r=Math.hypot(dx,dy); if (r>14) continue; let c; if (r>13) c=P.k; else if (pillow) c = r>10?P.G:(r>6?P.g:P.l); else { const t=(dx*-0.6+dy*-0.8)/14; c = t>0.45?P.l:(t>-0.35?P.g:P.G); } rect(x,c,i,j,1,1); } }
ball('shade3', false); ball('pillow', true);
// animation frames
drawG('idle0', hero(), 'meadow', {}, 4); drawG('idle1', hero(null, 1), 'meadow', {}, 4);
const walks = [hero(W1), hero(null,1), hero(W3), hero(null,1)]; walks.forEach((g,i)=>drawG('walk'+i, g, 'meadow', {}, 4));
const sword = (g, frame) => { const o = g.map(r=>[...r]); const put=(i,j,c)=>{ if(o[j]) o[j][i]=c; }; if (frame===0){ put(2,6,'d');put(2,7,'d');put(2,8,'k'); } if (frame===1){ for(let i=14;i<16;i++) put(i,9,'d'); put(13,9,'k'); put(15,8,'w'); } if (frame===2){ put(14,10,'d'); put(15,11,'d'); } return o.map(r=>r.join('')); };
[0,1,2].forEach(f=>drawG('atk'+f, sword(H,f), 'meadow', {}, 4));
drawG('hurt0', H.map(r=>r.replace(/[^.]/g,'w')), 'meadow', {}, 4, PAL.meadow.k);
drawG('hurt1', H.map(r=>'..'+r.slice(0,14)), 'meadow', {}, 4);
// variants
const V = [{}, {r:PAL.meadow.b,R:PAL.meadow.B}, {r:PAL.meadow.g,R:PAL.meadow.G}, {r:PAL.meadow.y,R:PAL.meadow.o,n:PAL.meadow.y}, {s:PAL.meadow.n,n:PAL.meadow.k}];
V.forEach((v,i)=>drawG('var'+i, H, 'meadow', v, 4));
drawG('var5', H.map((r,j)=>j>0&&j<5?r.replace(/n/g,'q'):r), 'dusk', {}, 4);
drawG('mon0', SPR.slime, 'meadow', {}, 4); drawG('mon1', SPR.slime, 'dusk', {g:PAL.dusk.r,G:PAL.dusk.R,l:PAL.dusk.y}, 4);
{ const c = SPR.slime.map(r=>r); c[1]='.....y.y.y......'; c[2]='.....yyyyy......'; c[3]='.....kkkkk......'; drawG('mon2', c, 'meadow', {}, 4); }
// live walk (stops with reduced motion)
{ let f = 0; const tick = () => { drawG('live', walks[f%4], 'meadow', {}, 6); f++; }; tick(); if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(tick, 120); }

</script>
