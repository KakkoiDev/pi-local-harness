<!doctype html>
<html>
<head><meta charset="utf-8"><title>LoadingState — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
  <figure class="ab-frame" data-device="desktop">
    <figcaption>Desktop · English · list and detail skeletons</figcaption>
    <div class="ab-screen app [transform:translateZ(0)] ">
<div class="grid grid-cols-2 gap-6 p-6"><div><div role="status" aria-live="polite" aria-busy="true">
  <span class="sr-only" data-t="loading.label">Loading notes…</span>
  <ul class="grid gap-2" aria-hidden="true">
    <li class="item" data-variant="outline">
      <section class="gap-2"><div class="skeleton motion-reduce:animate-none h-4 w-2/5"></div><div class="skeleton motion-reduce:animate-none h-3 w-4/5"></div></section>
      <aside class="grid justify-items-end gap-2"><div class="skeleton motion-reduce:animate-none h-5 w-20 rounded-full"></div><div class="skeleton motion-reduce:animate-none h-3 w-24"></div></aside>
    </li>
    <li class="item" data-variant="outline">
      <section class="gap-2"><div class="skeleton motion-reduce:animate-none h-4 w-2/5"></div><div class="skeleton motion-reduce:animate-none h-3 w-4/5"></div></section>
      <aside class="grid justify-items-end gap-2"><div class="skeleton motion-reduce:animate-none h-5 w-20 rounded-full"></div><div class="skeleton motion-reduce:animate-none h-3 w-24"></div></aside>
    </li>
    <li class="item" data-variant="outline">
      <section class="gap-2"><div class="skeleton motion-reduce:animate-none h-4 w-2/5"></div><div class="skeleton motion-reduce:animate-none h-3 w-4/5"></div></section>
      <aside class="grid justify-items-end gap-2"><div class="skeleton motion-reduce:animate-none h-5 w-20 rounded-full"></div><div class="skeleton motion-reduce:animate-none h-3 w-24"></div></aside>
    </li>
  </ul>
</div></div><div><div role="status" aria-busy="true" class="grid gap-6">
  <span class="sr-only" data-t="loading.label">Loading notes…</span>
  <div aria-hidden="true" class="grid gap-3">
    <div class="skeleton motion-reduce:animate-none h-3 w-48"></div>
    <div class="skeleton motion-reduce:animate-none h-8 w-2/3"></div>
    <div class="flex gap-2"><div class="skeleton motion-reduce:animate-none h-5 w-20 rounded-full"></div><div class="skeleton motion-reduce:animate-none h-5 w-28"></div></div>
  </div>
  <div aria-hidden="true" class="grid gap-2"><div class="skeleton motion-reduce:animate-none h-3 w-full"></div><div class="skeleton motion-reduce:animate-none h-3 w-11/12"></div><div class="skeleton motion-reduce:animate-none h-3 w-4/5"></div><div class="skeleton motion-reduce:animate-none h-3 w-3/5"></div></div>
</div></div></div>
    </div>
  </figure>
  <figure class="ab-frame" data-device="phone" lang="ja">
    <figcaption>Phone · 日本語 · list, slow</figcaption>
    <div class="ab-screen app [transform:translateZ(0)] ">
<div class="grid gap-3 p-4"><div role="status" aria-live="polite" aria-busy="true">
  <span class="sr-only" data-t="loading.label">ノートを読み込み中…</span>
  <ul class="grid gap-2" aria-hidden="true">
    <li class="item" data-variant="outline">
      <section class="gap-2"><div class="skeleton motion-reduce:animate-none h-4 w-2/5"></div><div class="skeleton motion-reduce:animate-none h-3 w-4/5"></div></section>
      <aside class="grid justify-items-end gap-2"><div class="skeleton motion-reduce:animate-none h-5 w-20 rounded-full"></div><div class="skeleton motion-reduce:animate-none h-3 w-24"></div></aside>
    </li>
    <li class="item" data-variant="outline">
      <section class="gap-2"><div class="skeleton motion-reduce:animate-none h-4 w-2/5"></div><div class="skeleton motion-reduce:animate-none h-3 w-4/5"></div></section>
      <aside class="grid justify-items-end gap-2"><div class="skeleton motion-reduce:animate-none h-5 w-20 rounded-full"></div><div class="skeleton motion-reduce:animate-none h-3 w-24"></div></aside>
    </li>
    <li class="item" data-variant="outline">
      <section class="gap-2"><div class="skeleton motion-reduce:animate-none h-4 w-2/5"></div><div class="skeleton motion-reduce:animate-none h-3 w-4/5"></div></section>
      <aside class="grid justify-items-end gap-2"><div class="skeleton motion-reduce:animate-none h-5 w-20 rounded-full"></div><div class="skeleton motion-reduce:animate-none h-3 w-24"></div></aside>
    </li>
  </ul>
</div><div class="flex items-center gap-3 text-sm text-muted-foreground"><span class="flex-1" data-t="loading.slow">まだ読み込み中です。いつもより時間がかかっています。</span><button type="button" class="btn" data-variant="outline" data-size="sm">キャンセル</button></div></div>
    </div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>A button waiting</figcaption>
    <div class="ab-screen app [transform:translateZ(0)] ">
<div class="p-4"><button type="submit" class="btn" disabled aria-busy="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="animate-spin motion-reduce:animate-none"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg><span>Saving…</span></button></div>
    </div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Reloading after a filter change</figcaption>
    <div class="ab-screen app [transform:translateZ(0)] ">
<div class="p-4"><ul class="grid gap-2 opacity-60" aria-busy="true"><li class="item" data-variant="outline"><section><h3>Week 3 · Vocabulary</h3><p>駅 (eki) station…</p></section></li><li class="item" data-variant="outline"><section><h3>Te-form practice</h3><p>Verbs: 食べる → 食べて…</p></section></li></ul></div>
    </div>
  </figure>
</div>
</body>
</html>
