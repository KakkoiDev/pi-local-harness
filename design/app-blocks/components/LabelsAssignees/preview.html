<!-- @dsCard group="Collaboration" height=720 width=1250 subtitle="Label and people pickers" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>LabelsAssignees — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
  <figure class="ab-frame" data-device="desktop">
    <figcaption>Desktop · English · labels picker open</figcaption>
    <div class="ab-screen app flex gap-8 p-6" style="height:480px">
      <section class="grid w-72 content-start gap-1 text-sm">
        <div class="popover ab-open grid gap-1">
          <button class="btn w-full justify-between" data-variant="ghost" data-size="sm" type="button" aria-expanded="true">Labels <span aria-hidden="true">⚙</span></button>
          <div data-popover aria-hidden="false" class="w-72 min-w-0 p-0">
            <header class="border-b p-2"><p class="text-xs font-medium">Apply labels to this issue</p><div class="input-group mt-2"><span data-align="inline-start" aria-hidden="true">⌕</span><input type="search" aria-label="Filter labels" placeholder="Filter labels"></div></header>
            <ul class="grid max-h-64 overflow-y-auto p-1" role="group" aria-label="Labels">
              <li><label class="label gap-2 rounded-sm px-2 py-1.5 font-normal"><input class="input" type="checkbox" checked><span class="size-3 rounded-full bg-destructive"></span><span class="flex-1">bug<small class="text-muted-foreground block text-xs">Something isn’t working</small></span></label></li>
              <li><label class="label gap-2 rounded-sm px-2 py-1.5 font-normal"><input class="input" type="checkbox"><span class="size-3 rounded-full" style="background: var(--chart-3)"></span><span class="flex-1">events<small class="text-muted-foreground block text-xs">School events and trips</small></span></label></li>
              <li><label class="label gap-2 rounded-sm px-2 py-1.5 font-normal"><input class="input" type="checkbox"><span class="size-3 rounded-full" style="background: var(--chart-4)"></span><span class="flex-1">i18n</span></label></li>
              <li><label class="label gap-2 rounded-sm bg-accent px-2 py-1.5 font-normal"><input class="input" type="checkbox" checked><span class="size-3 rounded-full" style="background: var(--chart-1)"></span><span class="flex-1">timetable</span></label></li>
            </ul>
            <footer class="border-t p-2"><a class="text-sm underline-offset-4 hover:underline" href="#">Edit Labels</a></footer>
          </div>
        </div>
      </section>
      <section class="grid w-60 content-start gap-3 text-sm">
        <div class="grid gap-1 border-b pb-3"><p class="text-muted-foreground px-2 text-xs font-medium">Assignees</p><p class="flex items-center gap-2 px-2"><span class="avatar" data-size="sm"><span class="bg-muted">RS</span></span>Ren Sato</p></div>
        <div class="grid gap-1 border-b pb-3"><p class="text-muted-foreground px-2 text-xs font-medium">Labels</p><p class="flex flex-wrap gap-1 px-2"><span class="badge" data-variant="destructive">bug</span><span class="badge" data-variant="outline"><span class="size-2 rounded-full" style="background: var(--chart-1)"></span>timetable</span></p></div>
        <div class="grid gap-1"><p class="text-muted-foreground px-2 text-xs font-medium">Label colours</p><p class="flex flex-wrap gap-1 px-2"><span class="badge" data-variant="destructive">bug</span><span class="badge" data-variant="outline"><span class="size-2 rounded-full" style="background: var(--chart-1)"></span>chart-1</span><span class="badge" data-variant="outline"><span class="size-2 rounded-full" style="background: var(--chart-2)"></span>chart-2</span><span class="badge" data-variant="outline"><span class="size-2 rounded-full" style="background: var(--chart-3)"></span>chart-3</span><span class="badge" data-variant="outline"><span class="size-2 rounded-full" style="background: var(--chart-4)"></span>chart-4</span><span class="badge" data-variant="outline"><span class="size-2 rounded-full" style="background: var(--chart-5)"></span>chart-5</span></p></div>
      </section>
    </div>
  </figure>
  <figure class="ab-frame" data-device="phone" lang="ja">
    <figcaption>Phone · 日本語 · assignees sheet</figcaption>
    <div class="ab-screen app flex flex-col" style="height:480px">
      <div class="flex-1 bg-muted/40"></div>
      <div class="grid gap-2 rounded-t-2xl border-t bg-popover p-4 shadow-lg" role="dialog" aria-labelledby="p-as">
        <div class="flex items-center justify-between"><h2 id="p-as" class="font-semibold">担当者</h2><button class="btn" data-variant="ghost" type="button">完了</button></div>
        <div class="input-group"><span data-align="inline-start" aria-hidden="true">⌕</span><input type="search" aria-label="メンバーを絞り込む" placeholder="メンバーを絞り込む"></div>
        <a href="#" class="text-sm underline">自分を割り当て</a>
        <ul class="grid">
          <li><label class="label min-h-11 gap-3 font-normal"><input class="input" type="checkbox" checked><span class="avatar" data-size="sm"><span class="bg-muted">佐</span></span><span class="flex-1">佐藤 蓮</span></label></li>
          <li><label class="label min-h-11 gap-3 font-normal"><input class="input" type="checkbox"><span class="avatar" data-size="sm"><span class="bg-muted">阿</span></span><span class="flex-1">阿部 かな</span></label></li>
          <li><label class="label min-h-11 gap-3 font-normal"><input class="input" type="checkbox"><span class="avatar" data-size="sm"><span class="bg-muted">森</span></span><span class="flex-1">森 海斗</span></label></li>
        </ul>
      </div>
    </div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>None set</figcaption>
    <div class="ab-screen app p-4 grid gap-1 text-sm"><p class="text-muted-foreground text-xs font-medium">Assignees</p><p>No one · <a href="#" class="underline">Assign Yourself</a></p></div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Filter with no match</figcaption>
    <div class="ab-screen app p-4 grid gap-2 text-sm"><p class="text-muted-foreground">No label called “museum”</p><button class="btn w-fit" data-variant="outline" data-size="sm" type="button">Create “museum”</button></div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Labels page row</figcaption>
    <div class="ab-screen app p-2"><div class="table-container"><table class="table"><thead><tr><th>Label</th><th>Issues</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody><tr><td><span class="badge" data-variant="destructive">bug</span></td><td>9</td><td class="text-right"><button class="btn" data-variant="ghost" data-size="sm" type="button">Edit</button></td></tr></tbody></table></div></div>
  </figure>
</div>
</body>
</html>
