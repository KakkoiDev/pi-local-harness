<!-- @dsCard group="Feedback" height=620 width=1250 subtitle="Success, error, with Undo" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toasts — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
  <figure class="ab-frame" data-device="desktop">
    <figcaption>Desktop · English · two toasts</figcaption>
    <div class="ab-screen app min-h-[360px] transform-gpu">
      <main class="p-6 grid gap-2 text-sm text-muted-foreground"><p>Week 3 · Vocabulary</p><p>Homework</p><p>Kanji quiz</p></main>
      <div class="toaster" data-align="end">
        <div class="toast" role="status" aria-atomic="true" data-category="success">
          <div class="toast-content">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            <section><h2>Note deleted</h2><p class="break-normal">“Week 3 · Vocabulary”</p></section>
            <footer><button type="button" class="btn" data-size="sm" data-toast-action>Undo</button></footer>
          </div>
        </div>
        <div class="toast" role="status" aria-atomic="true" data-category="info">
          <div class="toast-content">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            <section><h2>Link copied</h2></section>
          </div>
        </div>
      </div>
    </div>
  </figure>
  <figure class="ab-frame" data-device="phone" lang="ja">
    <figcaption>Phone · 日本語 · error, above the bottom bar</figcaption>
    <div class="ab-screen app min-h-[360px] transform-gpu">
      <main class="p-4 grid gap-2 text-sm text-muted-foreground"><p class="break-normal">第3週・単語</p><p>宿題</p></main>
      <div class="toaster pb-20">
        <div class="toast" role="alert" aria-atomic="true" data-category="error">
          <div class="toast-content">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
            <section><h2>保存できませんでした。接続を確認してください。</h2></section>
            <footer><button type="button" class="btn" data-size="sm" data-toast-action>もう一度試す</button></footer>
          </div>
        </div>
      </div>
      <nav class="absolute inset-x-0 bottom-0 h-16 border-t bg-background flex items-center justify-around text-xs text-muted-foreground"><span>ノート</span><span>検索</span><span>設定</span></nav>
    </div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Warning</figcaption>
    <div class="ab-screen app p-4">
      <div class="toaster" style="position:static;padding:0">
        <div class="toast" role="status" data-category="warning"><div class="toast-content">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><p class="break-normal"ath d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          <section><h2>Saved on this device</h2><p class="break-normal">It will sync when you’re back online.</p></section>
        </div></div>
      </div>
    </div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Success, no action</figcaption>
    <div class="ab-screen app p-4">
      <div class="toaster" style="position:static;padding:0">
        <div class="toast" role="status" data-category="success"><div class="toast-content">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          <section><h2>Invitation sent to ken@example.com</h2></section>
        </div></div>
      </div>
    </div>
  </figure>
</div>
</body>
</html>
