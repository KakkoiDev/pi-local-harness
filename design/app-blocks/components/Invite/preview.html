<!-- @dsCard group="Sharing and people" height=1310 width=1250 subtitle="Invite by email or link, accept page" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Invite — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
  <figure class="ab-frame" data-device="desktop"><figcaption>Desktop · English · dialog open</figcaption><div class="ab-screen app "><div class="grid min-h-[700px] place-items-center bg-black/10 p-4 backdrop-blur-xs"><div role="dialog" class="mx-auto grid w-full max-w-lg gap-6 rounded-xl bg-popover p-6 text-sm text-popover-foreground ring-1 ring-foreground/10 shadow-lg"><header class="grid gap-2"><h2 class="text-base font-semibold">Invite people to Class project</h2><p class="text-muted-foreground">They get an email with a link. Invitations expire after 7 days.</p></header>
<section class="grid gap-4"><form class="grid gap-2"><label class="label" for="e">Email addresses</label>
<div class="flex  gap-2"><input class="input flex-1" id="e" value="ren@example.com, mina@example.com"><select class="select w-32" aria-label="Role"><option>Member</option></select></div>
<p class="text-muted-foreground text-sm">Separate several addresses with commas.</p><button class="btn justify-self-end" type="button">Send Invitations</button></form>
<div class="grid gap-2"><h3 class="text-sm font-medium">People with access</h3><ul class="item-group">
<li class="item" data-size="sm"><figure><span class="avatar" data-size="sm"><span>AK</span></span></figure><section><h4>Aiko Kato <span class="text-muted-foreground font-normal">(you)</span></h4><p>aiko@example.com</p></section><aside class="flex gap-1"><span class="text-muted-foreground text-sm">Owner</span></aside></li>
<li class="item" data-size="sm"><figure><span class="avatar" data-size="sm"><span>RS</span></span></figure><section><h4>ren@example.com</h4><p><span class="badge" data-variant="outline">Invited</span> expires 25 Oct</p></section><aside class="flex gap-1"><button class="btn" data-variant="ghost" data-size="sm" type="button">Resend</button><button class="btn" data-variant="ghost" data-size="sm" type="button">Cancel</button></aside></li>
</ul></div>
<div class="grid gap-2 border-t pt-4"><h3 class="text-sm font-medium">Invite link</h3><div class="flex gap-2"><input class="input flex-1 font-mono text-xs" readonly value="https://notes.example.com/invites/k3p9-a72d" aria-label="Invite link"><button class="btn" data-variant="outline" type="button">Copy</button></div>
<p class="text-muted-foreground text-sm">Anyone with the link joins as a Viewer. <button class="btn" data-variant="link" data-size="sm" type="button">Reset Link…</button></p></div></section>
<footer class="flex justify-end"><button class="btn" data-variant="outline" type="button">Done</button></footer></div></div></div></figure>
  <figure class="ab-frame" data-device="phone" lang="ja"><figcaption>Phone · 日本語 · fields stacked, Share instead of Copy</figcaption><div class="ab-screen app "><div class="grid min-h-[700px] place-items-center bg-black/10 p-4 backdrop-blur-xs"><div role="dialog" class="mx-auto grid w-full max-w-lg gap-6 rounded-xl bg-popover p-6 text-sm text-popover-foreground ring-1 ring-foreground/10 shadow-lg"><header class="grid gap-2"><h2 class="text-base font-semibold">クラスのプロジェクトにメンバーを招待</h2><p class="text-muted-foreground">招待された人にはリンク付きのメールが届きます。招待の有効期限は 7 日間です。</p></header>
<section class="grid gap-4"><form class="grid gap-2"><label class="label" for="e">メールアドレス</label>
<div class="flex flex-col gap-2"><input class="input flex-1" id="e" value=""><select class="select w-full" aria-label="役割"><option>メンバー</option></select></div>
<p class="text-muted-foreground text-sm">複数のアドレスはカンマで区切ってください。</p><button class="btn w-full" type="button">招待を送信</button></form>
<div class="grid gap-2"><h3 class="text-sm font-medium">アクセスできるメンバー</h3><ul class="item-group">
<li class="item" data-size="sm"><figure><span class="avatar" data-size="sm"><span>AK</span></span></figure><section><h4>加藤 愛子 <span class="text-muted-foreground font-normal">（あなた）</span></h4><p>aiko@example.com</p></section><aside class="flex gap-1"><span class="text-muted-foreground text-sm">オーナー</span></aside></li>
<li class="item" data-size="sm"><figure><span class="avatar" data-size="sm"><span>RS</span></span></figure><section><h4>ren@example.com</h4><p><span class="badge" data-variant="outline">招待中</span> 有効期限 10月25日</p></section><aside class="flex gap-1"><button class="btn" data-variant="ghost" data-size="sm" type="button">再送信</button><button class="btn" data-variant="ghost" data-size="sm" type="button">取り消す</button></aside></li>
</ul></div>
<div class="grid gap-2 border-t pt-4"><h3 class="text-sm font-medium">招待リンク</h3><div class="flex gap-2"><input class="input flex-1 font-mono text-xs" readonly value="https://notes.example.com/invites/k3p9-a72d" aria-label="招待リンク"><button class="btn" data-variant="outline" type="button">共有</button></div>
<p class="text-muted-foreground text-sm">リンクを知っている人は誰でも閲覧者として参加できます。 <button class="btn" data-variant="link" data-size="sm" type="button">リンクを再発行…</button></p></div></section>
<footer class="flex justify-end"><button class="btn" data-variant="outline" type="button">完了</button></footer></div></div></div></figure>
  <figure class="ab-frame" data-device="state"><figcaption>Invalid email</figcaption><div class="ab-screen app p-4"><div class="field"><label class="label" for="s1">Email addresses</label><input class="input" id="s1" value="ren@example.com, mina@" aria-invalid="true"><p class="text-destructive text-sm">“mina@” isn’t an email address.</p></div></div></figure>
  <figure class="ab-frame" data-device="state"><figcaption>Accept page (/invites/…)</figcaption><div class="ab-screen app p-4 bg-muted/40"><div class="card w-full"><header><h1 class="text-lg font-semibold">Aiko invited you to Class project</h1><p class="text-muted-foreground text-sm">You’ll join as a Member: you can add and edit notes.</p></header><footer class="grid gap-2"><button class="btn w-full" type="button">Accept Invitation</button><button class="btn w-full" data-variant="ghost" type="button">Decline</button></footer></div></div></figure>
  <figure class="ab-frame" data-device="state"><figcaption>Not an owner: read-only</figcaption><div class="ab-screen app p-4"><p class="text-muted-foreground text-sm">Only owners can invite people.</p><ul class="item-group mt-2"><li class="item" data-size="sm"><figure><span class="avatar" data-size="sm"><span>AK</span></span></figure><section><h4>Aiko Kato</h4><p>aiko@example.com</p></section><aside class="flex gap-1"><span class="text-muted-foreground text-sm">Owner</span></aside></li><li class="item" data-size="sm"><figure><span class="avatar" data-size="sm"><span>MT</span></span></figure><section><h4>Mina Takahashi</h4><p>mina@example.com</p></section><aside class="flex gap-1"><span class="text-muted-foreground text-sm">Viewer</span></aside></li></ul></div></figure>
</div>
</body>
</html>
