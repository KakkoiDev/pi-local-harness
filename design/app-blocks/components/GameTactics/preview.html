"....krwrrrrRk...", "....krrrrrrRk...", "....krrrrrRRk...", ".....kRRRRRk....", "......kkkkk.....", "................", "................"], "grass": ["gggggggggggggggg", "gglggggggggGgggg", "gglGgggggggGlggg", "ggggggggggggggGg", "ggggGggggggggggg", "gggGlgggglgggggg", "gggggggggGlggggg", "gggggggggggggggg", "gGgggggggggggglg", "glggggggggggggGg", "gggggggGgggggggg", "ggggggglgggggggg", "gggggggggggGgggg", "gggglgggggglGggg", "ggggGggggggggggg", "gggggggggggggggg"], "heart": ["................", "................", "...kkk....kkk...", "..krrrk..krrrk..", ".krwwrrkkrrrrRk.", ".krwrrrrrrrrrRk.", ".krrrrrrrrrrrRk.", ".krrrrrrrrrrRRk.", "..krrrrrrrrRRk..", "...krrrrrrRRk...", "....krrrrRRk....", ".....krrRRk.....", "......krRk......", ".......kk.......", "................", "................"], "coin": ["................", "................", ".....kkkkkk.....", "....kyyyyyyk....", "...kywwyyyyok...", "...kywyyooyok...", "...kyyyoyyyok...", "...kyyyoyyyok...", "...kyyyoyyyok...", "...kyyyooyyok...", "...kyyyyyyook...", "....kooooook....", ".....kkkkkk.....", "................", "................", "................"], "ship": [".......kk.......", "......kwwk......", "......kbbk......", ".....kbwwbk.....", ".....kbwwbk.....", "....kbbbbbbk....", "...kBbbbbbbBk...", "..kBbbbyybbbBk..", ".kBbbbbyybbbbBk.", ".kBBkbbbbbbkBBk.", ".kkk.kbbbbk.kkk.", ".....kBBBBk.....", "......kyyk......", "......kryk......", ".......kk.......", "................"], "button9": ["..kkkkkkkk..", ".kwwwwwwwwk.", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kooooooooook", ".kooooooook.", "..kkkkkkkk.."], "frame9": [".kkkkkkkkkk.", "kwwwwwwwwwwk", "kwqqqqqqqqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqqqqqqqqdk", "kddddddddddk", ".kkkkkkkkkk."]};
function grid(name,pal,swap){const p=Object.assign({},PAL[pal||'meadow'],swap||{});return SPR[name].map(r=>[...r].map(c=>c==='.'?null:p[c]||c))}
function blit(ctx,g,x,y,s,flip){s=s||1;for(let j=0;j<g.length;j++)for(let i=0;i<g[j].length;i++){const c=g[j][flip?g[j].length-1-i:i];if(c){ctx.fillStyle=c;ctx.fillRect(x+i*s,y+j*s,s,s)}}}
function sprite(ctx,name,x,y,s,pal,swap,flip){blit(ctx,grid(name,pal,swap),x,y,s,flip)}
function canvasOf(id,w,h){const c=document.getElementById(id);c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return x}
function rect(ctx,c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}


const P = (pid) => PAL[pid];
function tiles(x, name, W, H, pal, swap) { for (let j=0;j<H;j+=16) for (let i=0;i<W;i+=16) sprite(x, name, i, j, 1, pal, swap); }
function stars(x, W, H, c, n, seed) { let s = seed||7; for (let i=0;i<n;i++) { s=(s*9301+49297)%233280; const a=s/233280; s=(s*9301+49297)%233280; const b=s/233280; rect(x, c, Math.floor(a*W), Math.floor(b*H), 1, 1); } }

function circle(x, c, cx, cy, r, stroke) { x.save(); x.beginPath(); x.arc(cx, cy, r, 0, Math.PI*2); if (stroke) { x.strokeStyle=c; x.lineWidth=1; x.stroke(); } else { x.fillStyle=c; x.fill(); } x.restore(); }
function scene(id, W, H, fn) { const x = canvasOf(id, W, H); fn(x, W, H); }
const draw = (x, W, H) => { const p = PAL.meadow; tiles(x, 'grass', W, H); const T = 16;
  for (let j=0;j<H;j+=T) for (let i=0;i<W;i+=T) { rect(x, 'rgba(27,28,43,.25)', i, j, T, 1); rect(x, 'rgba(27,28,43,.25)', i, j, 1, T); }
  const ux = Math.floor(W/T/2)*T - T, uy = Math.floor(H/T/2)*T - (H > W ? 0 : T);
  for (let dj=-2;dj<=2;dj++) for (let di=-2;di<=2;di++) { const d = Math.abs(di)+Math.abs(dj); if (d===0 || d>3) continue; rect(x, d===3 ? 'rgba(224,90,71,.45)' : 'rgba(74,163,223,.45)', ux+di*T+1, uy+dj*T+1, T-1, T-1); }
  tree(x, ux+3*T+8, uy-T+14); tree(x, ux-3*T+8, uy+2*T+14);
  sprite(x, 'hero', ux, uy, 1, 'meadow', {r: p.b, R: p.B}); sprite(x, 'hero', ux-2*T, uy-T, 1, 'meadow', {r: p.b, R: p.B, s: p.d, n: p.q, B: p.q});
  sprite(x, 'hero', ux+2*T, uy+T, 1, 'meadow'); sprite(x, 'slime', ux+T*2, uy-T);
  rect(x, p.y, ux+2*T, uy-T, 4, 1); rect(x, p.y, ux+2*T, uy-T, 1, 4); rect(x, p.y, ux+3*T-4, uy-T, 4, 1); rect(x, p.y, ux+3*T-1, uy-T, 1, 4); rect(x, p.y, ux+2*T, uy-1, 4, 1); rect(x, p.y, ux+2*T, uy-4, 1, 4); rect(x, p.y, ux+3*T-4, uy-1, 4, 1); rect(x, p.y, ux+3*T-1, uy-4, 1, 4); };
scene('cd', 200, 112, draw); scene('cp', 97, 160, draw); scene('cs', 97, 75, draw);
{ const x = canvasOf('pt', 16, 16); sprite(x, 'hero', 0, 2, 1, 'meadow', {r: PAL.meadow.b, R: PAL.meadow.B}); }
