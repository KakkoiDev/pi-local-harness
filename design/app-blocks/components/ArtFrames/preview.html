</svg><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#1b1c2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="key"><circle cx="8" cy="12" r="4" fill="#f2b33d"/><path d="M12 12h9M18 12v3M21 12v2" /></svg><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#1b1c2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="star"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.8z" fill="#f2b33d"/></svg><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#1b1c2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="gear"><circle cx="12" cy="12" r="3" fill="#9aa0b8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" /><circle cx="12" cy="12" r="6.5" fill="none"/></svg><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#1b1c2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="map"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" fill="#a7d86d"/><path d="M9 4v14M15 6v14" /></svg><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#1b1c2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="sword"><path d="M14.5 3.5H20.5V9.5L10 20l-6-6z" fill="#9aa0b8"/><path d="M7 13l4 4M3.5 20.5l3-3" /></svg></div><div style="position:relative;width:96px;height:96px"><svg viewBox="0 0 24 24" width="96" height="96" fill="none" stroke="#1b1c2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="potion"><path d="M10 3h4M10.5 3v5L6 15a4 4 0 0 0 3.4 6h5.2A4 4 0 0 0 18 15l-4.5-7V3" fill="#e05a47"/><path d="M7.5 15h9" /></svg><svg viewBox="0 0 24 24" width="96" height="96" style="position:absolute;inset:0"><g stroke="#4aa3df" stroke-width=".08" opacity=".7"><path d="M0 0V24M0 0H24"/><path d="M2 0V24M0 2H24"/><path d="M4 0V24M0 4H24"/><path d="M6 0V24M0 6H24"/><path d="M8 0V24M <script>
const PAL={"meadow": {"k": "#1b1c2b", "p": "#2b2d42", "q": "#4a4e69", "d": "#9aa0b8", "w": "#f4efe1", "y": "#f2b33d", "o": "#c27c2c", "r": "#e05a47", "R": "#9e3a3a", "g": "#5bb85d", "G": "#3a7d44", "l": "#a7d86d", "b": "#4aa3df", "B": "#2f6a9e", "s": "#f0b48a", "n": "#7a5236", "Q": "#9aa0b8"}, "dusk": {"k": "#0f0e17", "p": "#241e3a", "q": "#3d3363", "Q": "#6c5f9e", "d": "#a99ad6", "w": "#f5ecff", "y": "#ffb86b", "o": "#c9743e", "r": "#ff5c7a", "R": "#a3324f", "g": "#5ee6b0", "G": "#2f9e7d", "b": "#59c3ff", "B": "#2f6fb8", "s": "#e8b4a0", "n": "#6b4a3a", "l": "#f5ecff"}, "arcade": {"k": "#0b0b12", "p": "#1f2a5c", "q": "#5a5560", "d": "#c5c7cf", "w": "#fbf5ea", "y": "#ffae1a", "r": "#ff3b5c", "R": "#7a2a6b", "g": "#2ee66b", "G": "#0f8a5f", "b": "#3aa8ff", "n": "#a8552f", "s": "#a8552f", "B": "#1f2a5c", "l": "#2ee66b", "o": "#a8552f", "Q": "#c5c7cf"}, "ink": {"k": "#111111", "q": "#3d3d3d", "d": "#aaaaaa", "w": "#f2f2ec", "p": "#3d3d3d", "r": "#aaaaaa", "R": "#3d3d3d", "g": "#aaaaaa", "G": "#3d3d3d", "l": "#f2f2ec", "y": "#f2f2ec", "o": "#aaaaaa", "b": "#aaaaaa", "B": "#3d3d3d", "s": "#f2f2ec", "n": "#3d3d3d", "Q": "#aaaaaa"}}, SPR={"hero": ["................", ".....kkkkkk.....", "....knnnnnnk....", "...knnnnnnnnk...", "...knnsssssnk...", "...knskssksnk...", "....ksssssssk...", ".....ksssssk....", "....kkrrrrrkk...", "...ksrrryrrRsk..", "...ksrRyyyRRsk..", "...kkrrrrrRRkk..", "....kBBBkBBBk...", "....kBBBkBBBk...", "....knnnknnnk...", "....kkkk.kkkk..."], "slime": ["................", "................", "................", "................", "......kkkk......", "....kkggggkk....", "...kgllggggGk...", "..kglggggggGGk..", "..kgggwkggwkGk..", ".kggggkkggkkgGk.", ".kgggggggggggGk.", ".kggggggggggGGk.", ".kGgggggggggGGk.", "..kGGGGGGGGGGk..", "...kkkkkkkkkk...", "................"], "potion": ["................", "......kkkk......", "......knnk......", "......kkkk......", ".......kwk......", ".......kwk......", "......kwwwk.....", ".....kwwwwwk....", "....kwrrrrrwk...", "....krwrrrrRk...", "....krrrrrrRk...", "....krrrrrRRk...", ".....kRRRRRk....", "......kkkkk.....", "................", "................"], "grass": ["gggggggggggggggg", "gglggggggggGgggg", "gglGgggggggGlggg", "ggggggggggggggGg", "ggggGggggggggggg", "gggGlgggglgggggg", "gggggggggGlggggg", "gggggggggggggggg", "gGgggggggggggglg", "glggggggggggggGg", "gggggggGgggggggg", "ggggggglgggggggg", "gggggggggggGgggg", "gggglgggggglGggg", "ggggGggggggggggg", "gggggggggggggggg"], "heart": ["................", "................", "...kkk....kkk...", "..krrrk..krrrk..", ".krwwrrkkrrrrRk.", ".krwrrrrrrrrrRk.", ".krrrrrrrrrrrRk.", ".krrrrrrrrrrRRk.", "..krrrrrrrrRRk..", "...krrrrrrRRk...", "....krrrrRRk....", ".....krrRRk.....", "......krRk......", ".......kk.......", "................", "................"], "coin": ["................", "................", ".....kkkkkk.....", "....kyyyyyyk....", "...kywwyyyyok...", "...kywyyooyok...", "...kyyyoyyyok...", "...kyyyoyyyok...", "...kyyyoyyyok...", "...kyyyooyyok...", "...kyyyyyyook...", "....kooooook....", ".....kkkkkk.....", "................", "................", "................"], "ship": [".......kk.......", "......kwwk......", "......kbbk......", ".....kbwwbk.....", ".....kbwwbk.....", "....kbbbbbbk....", "...kBbbbbbbBk...", "..kBbbbyybbbBk..", ".kBbbbbyybbbbBk.", ".kBBkbbbbbbkBBk.", ".kkk.kbbbbk.kkk.", ".....kBBBBk.....", "......kyyk......", "......kryk......", ".......kk.......", "................"], "button9": ["..kkkkkkkk..", ".kwwwwwwwwk.", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kwyyyyyyyyok", "kooooooooook", ".kooooooook.", "..kkkkkkkk.."], "frame9": [".kkkkkkkkkk.", "kwwwwwwwwwwk", "kwqqqqqqqqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqppppppqdk", "kwqqqqqqqqdk", "kddddddddddk", ".kkkkkkkkkk."]};
function grid(name,pal,swap){const p=Object.assign({},PAL[pal||'meadow'],swap||{});return SPR[name].map(r=>[...r].map(c=>c==='.'?null:p[c]||c))}
function blit(ctx,g,x,y,s,flip){s=s||1;for(let j=0;j<g.length;j++)for(let i=0;i<g[j].length;i++){const c=g[j][flip?g[j].length-1-i:i];if(c){ctx.fillStyle=c;ctx.fillRect(x+i*s,y+j*s,s,s)}}}
function sprite(ctx,name,x,y,s,pal,swap,flip){blit(ctx,grid(name,pal,swap),x,y,s,flip)}
function canvasOf(id,w,h){const c=document.getElementById(id);c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return x}
function rect(ctx,c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}


function nine(id, src, w, h, s, pal, swap) { const x = canvasOf(id, w*s, h*s); const P = Object.assign({}, PAL[pal||'meadow'], swap||{}); const g = SPR[src]; const n = g.length, c = 4;
  const px = (si, sj) => { const ch = g[sj][si]; return ch==='.'?null:P[ch]; };
  for (let j=0;j<h;j++) for (let i=0;i<w;i++) { const si = i<c?i:(i>=w-c?n-(w-i):c+((i-c)%(n-2*c))); const sj = j<c?j:(j>=h-c?n-(h-j):c+((j-c)%(n-2*c))); const col = px(si,sj); if (col) rect(x,col,i*s,j*s,s,s); } return x; }
nine('src9', 'frame9', 12, 12, 8); nine('nine1', 'frame9', 80, 30, 4); nine('nine2', 'frame9', 30, 30, 4);
function btn(id, state) { const sw = state==='disabled'?{y:PAL.meadow.q,o:PAL.meadow.p,w:PAL.meadow.q}:(state==='pressed'?{o:PAL.meadow.y,w:PAL.meadow.y}:{}); const x = nine(id, 'button9', 48, 16, 4, 'meadow', sw);
  if (state==='focus') { x.fillStyle = '#fff'; x.fillRect(8,4,176,4); x.fillRect(4,8,4,48); }
  x.fillStyle = state==='disabled'?PAL.meadow.d:PAL.meadow.k; x.font = '16px Silkscreen, monospace'; x.textBaseline='middle'; x.fillText((state==='focus'?'▶ ':'')+'START', state==='focus'?44:58, state==='pressed'?34:30); }
['normal','focus','pressed','disabled'].forEach(s=>btn('btn'+s, s)); btn('mixbad','normal');
for (const n of ['heart','coin','potion']) { const x = canvasOf('ic'+n, 16, 16); sprite(x, n, 0, 0, 1); }
document.fonts && document.fonts.ready.then(()=>{ ['normal','focus','pressed','disabled'].forEach(s=>btn('btn'+s, s)); btn('mixbad','normal'); });

</script>
