<!-- @dsCard group="Collaboration" height=790 width=1250 subtitle="Replies beside the channel" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Threads — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
  <figure class="ab-frame" data-device="desktop">
    <figcaption>Desktop · English · channel and thread panel</figcaption>
    <div class="ab-screen app flex" style="height:560px">
      <section class="flex-1 grid content-start gap-4 p-4 text-sm">
        <h2 class="font-semibold"># field-trip</h2>
        <article class="grid grid-cols-[auto_1fr] gap-x-3 rounded-md bg-accent/60 p-2">
          <span class="avatar"><span class="bg-muted">RS</span></span>
          <div class="grid gap-1"><p><b>Ren Sato</b> <span class="text-muted-foreground text-xs">10:04</span></p><p>Who can bring the class banner?</p>
            <button class="btn h-auto w-fit gap-2 px-2 py-1" data-variant="ghost" type="button" aria-expanded="true"><span class="avatar-group"><span class="avatar" data-size="sm"><span class="bg-muted">KA</span></span><span class="avatar" data-size="sm"><span class="bg-muted">KM</span></span></span><span class="text-sm font-medium">4 replies</span><span class="text-muted-foreground text-xs">Last reply 10:32</span></button>
          </div>
        </article>
        <article class="grid grid-cols-[auto_1fr] gap-x-3 p-2"><span class="avatar"><span class="bg-muted">KM</span></span><div><p><b>Kaito Mori</b> <span class="text-muted-foreground text-xs">10:20</span></p><p>Bus leaves at 8:30 sharp.</p></div></article>
      </section>
      <aside class="flex h-full w-96 flex-col border-l bg-background">
        <header class="flex items-center justify-between gap-2 border-b px-4 py-3">
          <div><h2 class="font-semibold">Thread</h2><p class="text-muted-foreground text-xs">#field-trip</p></div>
          <div class="flex gap-1"><button class="btn" data-variant="outline" data-size="sm" type="button" aria-pressed="true">Following</button><button class="btn" data-variant="ghost" data-size="icon" type="button" aria-label="Close thread">✕</button></div>
        </header>
        <ol class="grid flex-1 content-start gap-4 overflow-y-auto px-4 py-3 text-sm">
          <li class="grid grid-cols-[auto_1fr] gap-x-3"><span class="avatar"><span class="bg-muted">RS</span></span><div><p><b>Ren Sato</b> <span class="text-muted-foreground text-xs">10:04</span></p><p>Who can bring the class banner?</p></div></li>
          <li role="separator" class="text-muted-foreground flex items-center gap-2 text-xs"><hr class="flex-1"><span>4 replies</span><hr class="flex-1"></li>
          <li class="grid grid-cols-[auto_1fr] gap-x-3"><span class="avatar"><span class="bg-muted">KA</span></span><div><p><b>Kana Abe</b> <span class="text-muted-foreground text-xs">10:12</span></p><p>I can, it’s in the art room.</p></div></li>
          <li class="grid grid-cols-[auto_1fr] gap-x-3"><span class="avatar"><span class="bg-muted">KM</span></span><div><p><b>Kaito Mori</b> <span class="text-muted-foreground text-xs">10:32</span></p><p>I’ll help carry it. It’s heavy.</p></div></li>
          <li class="grid grid-cols-[auto_1fr] gap-x-3 opacity-60"><span class="avatar"><span class="bg-muted">YO</span></span><div><p><b>You</b> <span class="text-muted-foreground text-xs">Sending…</span></p><p>Thanks, both of you.</p></div></li>
        </ol>
        <form class="grid gap-2 border-t p-3">
          <textarea class="textarea min-h-16" rows="2" placeholder="Reply…" aria-label="Reply"></textarea>
          <div class="flex items-center justify-between gap-2"><label class="label gap-2 text-sm font-normal"><input class="input" type="checkbox"><span>Also send to #field-trip</span></label><button class="btn" data-size="sm" type="button">Reply</button></div>
        </form>
      </aside>
    </div>
  </figure>
  <figure class="ab-frame" data-device="phone" lang="ja">
    <figcaption>Phone · 日本語 · full screen with back</figcaption>
    <div class="ab-screen app flex flex-col" style="height:560px">
      <header class="flex items-center gap-2 border-b px-2 py-2"><button class="btn" data-variant="ghost" data-size="icon" type="button" aria-label="スレッドを閉じる">←</button><div><h2 class="font-semibold">スレッド</h2><p class="text-muted-foreground text-xs">#遠足</p></div></header>
      <ol class="grid flex-1 content-start gap-4 overflow-y-auto px-4 py-3 text-sm">
        <li class="grid grid-cols-[auto_1fr] gap-x-3"><span class="avatar"><span class="bg-muted">佐</span></span><div><p><b>佐藤 蓮</b> <span class="text-muted-foreground text-xs">10:04</span></p><p>クラスの横断幕を持ってこられる人はいますか？</p></div></li>
        <li role="separator" class="text-muted-foreground flex items-center gap-2 text-xs"><hr class="flex-1"><span>4 件の返信</span><hr class="flex-1"></li>
        <li class="grid grid-cols-[auto_1fr] gap-x-3"><span class="avatar"><span class="bg-muted">阿</span></span><div><p><b>阿部 かな</b> <span class="text-muted-foreground text-xs">10:12</span></p><p>持っていけます。美術室にあります。</p></div></li>
      </ol>
      <form class="grid gap-2 border-t p-3"><textarea class="textarea" rows="1" placeholder="返信を入力…" aria-label="返信"></textarea><div class="flex items-center justify-between gap-2"><label class="label gap-2 text-sm font-normal"><input class="input" type="checkbox"><span>#遠足 にも送信</span></label><button class="btn" type="button">返信</button></div></form>
    </div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>New replies while scrolled up</figcaption>
    <div class="ab-screen app p-4 grid justify-items-center"><button class="btn rounded-full" data-size="sm" type="button">2 new replies ↓</button></div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>Not sent</figcaption>
    <div class="ab-screen app p-4 text-sm grid gap-1"><p>Thanks, both of you.</p><p class="flex items-center gap-2"><span class="text-destructive">Not sent.</span><button class="btn" data-variant="outline" data-size="sm" type="button">Retry</button><button class="btn" data-variant="ghost" data-size="sm" type="button">Delete</button></p></div>
  </figure>
  <figure class="ab-frame" data-device="state">
    <figcaption>No replies yet</figcaption>
    <div class="ab-screen app p-4 text-sm text-muted-foreground">No replies yet. Start the thread.</div>
  </figure>
</div>
</body>
</html>
