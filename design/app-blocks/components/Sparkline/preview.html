<!-- @dsCard group="Charts" height=457 width=1250 subtitle="Word-sized trend" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sparkline — preview</title></head>
<body class="bg-background text-foreground">
<div class="ab-stage">
<figure class="ab-frame" data-device="desktop">
<figcaption>Desktop · English · in an item row</figcaption>
<div class="ab-screen app">
<div class="p-4">
<div class="grid grid-cols-2 gap-4"><div><div class="item" data-variant="outline">
  <section>
    <h3 class="text-sm font-medium" data-t="chart.signups.title">Sign-ups this week</h3>
    <div class="text-foreground text-2xl font-semibold tabular-nums">64</div>
    <p class="text-muted-foreground text-xs" data-t="chart.signups.delta">▲ 5 % from last week · 12 weeks shown</p>
  </section>
  <aside><canvas id="d-signups-spark" class="chart aspect-auto h-10 w-32" role="img" aria-label="Sign-ups per week rose from 42 to 64 over 12 weeks." data-chart-type="line" data-chart-label-key="week" data-chart-data='[{"week":"W1","signups":42},{"week":"W2","signups":45},{"week":"W3","signups":44},{"week":"W4","signups":47},{"week":"W5","signups":51},{"week":"W6","signups":49},{"week":"W7","signups":53},{"week":"W8","signups":56},{"week":"W9","signups":55},{"week":"W10","signups":58},{"week":"W11","signups":61},{"week":"W12","signups":64}]' data-chart-series='{"signups":{"label":"Sign-ups","color":"var(--chart-1)","surface":true}}' data-chart-legend="false" data-chart-tooltip="false"></canvas></aside>
</div>
<details class="mt-2"><summary class="text-sm" data-t="chart.show_table">Show as a table</summary><div class="table-container"><table class="table"><thead><tr><th>Week</th><th>Sign-ups</th></tr></thead><tbody><tr><th scope="row">W7</th><td class="text-right tabular-nums">53</td></tr><tr><th scope="row">W8</th><td class="text-right tabular-nums">56</td></tr><tr><th scope="row">W9</th><td class="text-right tabular-nums">55</td></tr><tr><th scope="row">W10</th><td class="text-right tabular-nums">58</td></tr><tr><th scope="row">W11</th><td class="text-right tabular-nums">61</td></tr><tr><th scope="row">W12</th><td class="text-right tabular-nums">64</td></tr></tbody></table></div></details></div></div>
</div>
</div>
</figure>
<figure class="ab-frame" data-device="phone" lang="ja">
<figcaption>Phone · 日本語</figcaption>
<div class="ab-screen app">
<div class="p-4">
<div class="item" data-variant="outline">
  <section>
    <h3 class="text-sm font-medium" data-t="chart.signups.title">今週の新規登録</h3>
    <div class="text-foreground text-2xl font-semibold tabular-nums">64</div>
    <p class="text-muted-foreground text-xs" data-t="chart.signups.delta">▲ 先週から5% · 12週分を表示</p>
  </section>
  <aside><canvas id="p-signups-spark" class="chart aspect-auto h-10 w-32" role="img" aria-label="週ごとの新規登録は12週で42から64に増えました。" data-chart-type="line" data-chart-label-key="week" data-chart-data='[{"week":"W1","signups":42},{"week":"W2","signups":45},{"week":"W3","signups":44},{"week":"W4","signups":47},{"week":"W5","signups":51},{"week":"W6","signups":49},{"week":"W7","signups":53},{"week":"W8","signups":56},{"week":"W9","signups":55},{"week":"W10","signups":58},{"week":"W11","signups":61},{"week":"W12","signups":64}]' data-chart-series='{"signups":{"label":"新規登録","color":"var(--chart-1)","surface":true}}' data-chart-legend="false" data-chart-tooltip="false"></canvas></aside>
</div>
<details class="mt-2"><summary class="text-sm" data-t="chart.show_table">表で表示</summary><div class="table-container"><table class="table"><thead><tr><th>週</th><th>新規登録</th></tr></thead><tbody><tr><th scope="row">W7</th><td class="text-right tabular-nums">53</td></tr><tr><th scope="row">W8</th><td class="text-right tabular-nums">56</td></tr><tr><th scope="row">W9</th><td class="text-right tabular-nums">55</td></tr><tr><th scope="row">W10</th><td class="text-right tabular-nums">58</td></tr><tr><th scope="row">W11</th><td class="text-right tabular-nums">61</td></tr><tr><th scope="row">W12</th><td class="text-right tabular-nums">64</td></tr></tbody></table></div></details>
</div>
</div>
</figure>
<figure class="ab-frame" data-device="state">
<figcaption>Inline in a sentence</figcaption>
<div class="ab-screen app">
<div class="p-4">
<p class="text-sm">Response time <canvas id="s3-rt-spark" class="chart aspect-auto inline-block h-5 w-20 align-middle" role="img" aria-label="Response time steady around 220 ms this week." data-chart-type="line" data-chart-label-key="d" data-chart-data='[{"d":0,"ms":230},{"d":1,"ms":221},{"d":2,"ms":218},{"d":3,"ms":240},{"d":4,"ms":216},{"d":5,"ms":219},{"d":6,"ms":222}]' data-chart-series='{"ms":{"label":"ms","color":"var(--chart-3)"}}' data-chart-legend="false" data-chart-tooltip="false"></canvas> <span class="tabular-nums">222 ms</span></p>
</div>
</div>
</figure>
<figure class="ab-frame" data-device="state">
<figcaption>Loading</figcaption>
<div class="ab-screen app">
<div class="p-4">
<div class="item" data-variant="outline"><section><div class="skeleton h-4 w-28"></div><div class="skeleton mt-2 h-7 w-16"></div></section><aside><div class="skeleton h-10 w-32" role="status" aria-busy="true"><span class="sr-only">Loading the chart…</span></div></aside></div>
</div>
</div>
</figure>
<figure class="ab-frame" data-device="state">
<figcaption>Not enough data (fewer than 3 points)</figcaption>
<div class="ab-screen app">
<div class="p-4">
<div class="item" data-variant="outline"><section><h3 class="text-sm font-medium">Sign-ups this week</h3><p class="text-2xl font-semibold tabular-nums">3</p><p class="text-muted-foreground text-xs">A trend appears after 3 weeks.</p></section></div>
</div>
</div>
</figure>
</div>
<script src="../lib/chart.umd.min.js"></script>
<script src="../lib/basecoat.all.min.js"></script>
<script src="../lib/basecoat.chart.min.js"></script>
<script>
basecoat.chart(document.getElementById('d-signups-spark'), {options: {scales: {x: {display: false}, y: {display: false}}, elements: {point: {radius: 0}, line: {borderWidth: 2}}, layout: {padding: 2}}});
basecoat.chart(document.getElementById('p-signups-spark'), {options: {scales: {x: {display: false}, y: {display: false}}, elements: {point: {radius: 0}, line: {borderWidth: 2}}, layout: {padding: 2}}});
basecoat.chart(document.getElementById('s3-rt-spark'), {options: {scales: {x: {display: false}, y: {display: false}}, elements: {point: {radius: 0}, line: {borderWidth: 2}}, layout: {padding: 2}}});
</script>
</body>
</html>
