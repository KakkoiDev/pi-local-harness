<!doctype html>
<html>
<head><meta charset="utf-8"><title>Composer — preview</title></head>
<body style="margin:0;background:var(--paper)">
<div class="pw-root" style="padding:16px;background:var(--paper)">
<form class="pw-composer pw-window" style="max-width:640px"><div class="pw-chips"><span class="pw-chip"><span>screenshot.png</span><button type="button" aria-label="Remove screenshot.png"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" shape-rendering="crispEdges"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.5"/></svg></button></span><span class="pw-chip"><span>memo.m4a</span><button type="button" aria-label="Remove memo.m4a"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" shape-rendering="crispEdges"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.5"/></svg></button></span></div><label class="pw-label" for="p">Message to Pi</label><textarea id="p" class="pw-field" rows="2"></textarea><div class="pw-composer__row"><button type="button" class="pw-btn">Attach…</button><button type="button" class="pw-btn"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" shape-rendering="crispEdges"><rect x="5.5" y=".5" width="5" height="9" rx="2.5" fill="none" stroke="currentColor"/><path d="M2.5 7.5a5.5 5.5 0 0 0 11 0M8 13v2.5M5 15.5h6" fill="none" stroke="currentColor"/></svg>Record</button><span class="pw-help">Return sends · Shift-Return adds a line</span><span style="flex:1"></span><button type="button" class="pw-btn">Stop<span class="pw-kbd">⌘.</span></button><button class="pw-btn pw-btn--default">Queue</button></div></form>
</div>
</body>
</html>
